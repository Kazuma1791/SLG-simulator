<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人領地戰 - 2D 沙盤 SLG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1120; color: #f1f5f9; padding: 16px; }
    .container { max-width: 920px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; border: 1px solid #334155; }
    h2, h3 { color: #38bdf8; margin-bottom: 8px; }
    .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 6px; }
    .res-box { background: #0b1120; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #334155; }
    .res-box span { font-weight: bold; font-size: 1.15rem; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .item-card { background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    
    /* 地圖畫布容器 */
    .map-frame { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid #475569; background: #0f172a; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    canvas { display: block; width: 100%; height: auto; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .log-box { background: #050814; padding: 10px; border-radius: 6px; max-height: 110px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #1e293b; }
    .log-box p { margin-bottom: 4px; border-bottom: 1px solid #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部資訊與資源狀態 -->
    <div class="card">
      <h2 id="player-title">🏰 正在探測領地坐標...</h2>
      <div class="res-grid">
        <div class="res-box">🌲 木材<br><span id="res-wood">0</span></div>
        <div class="res-box">⛏️ 鐵礦<br><span id="res-iron">0</span></div>
        <div class="res-box">🌾 糧食<br><span id="res-food">0</span></div>
        <div class="res-box">🛡️ 步兵<br><span id="res-troops">0</span></div>
      </div>
      <div id="queue-status" style="color: #f59e0b; font-size: 0.85rem; min-height: 18px;"></div>
    </div>

    <!-- 2D Canvas 大地圖沙盤 -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3>🗺️ 世界沙盤（拖曳平移地圖 / 滾輪縮放視野）</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:0.8rem; color:#94a3b8;" id="zoom-indicator">縮放: 100%</span>
          <button onclick="locateHome()" style="background:#0284c7; padding:4px 10px; font-size:0.8rem;">📍 定位我的城堡</button>
        </div>
      </div>
      <div class="map-frame">
        <canvas id="worldCanvas" width="880" height="440"></canvas>
      </div>
    </div>

    <!-- 城內建設與徵兵 -->
    <div class="card">
      <h3>城內設施營造</h3>
      <div class="grid" id="building-container"></div>
      <div style="margin-top: 10px;">
        <button id="train-btn" onclick="trainTroops()">招募 5 名步兵 (耗時 5 秒)</button>
      </div>
    </div>

    <!-- 戰報中心 -->
    <div class="card">
      <h3>王國戰事紀錄</h3>
      <div class="log-box" id="log-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, onSnapshot, collection, runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 專案配置
    const firebaseConfig = {
      apiKey: "AIzaSyCaowUN5atHnnlfvGmfWA0PDyjfQU3Qr0U",
      authDomain: "slg-game-617b3.firebaseapp.com",
      projectId: "slg-game-617b3",
      storageBucket: "slg-game-617b3.firebasestorage.app",
      messagingSenderId: "418102371703",
      appId: "1:418102371703:web:d872ccee572039b65d2d72",
      measurementId: "G-1VVT8L7EZC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid = null;
    let myData = null;
    let allPlayers = [];
    let hasCentered = false;

    // 地圖與相機系統參數
    const TILE_SIZE = 55;
    const WORLD_COLS = 50;
    const WORLD_ROWS = 50;

    let camX = 0;
    let camY = 0;
    let zoom = 1.0;
    const MIN_ZOOM = 0.35; // 宏觀俯瞰視角
    const MAX_ZOOM = 1.8;  // 特寫視角

    const canvas = document.getElementById("worldCanvas");
    const ctx = canvas.getContext("2d");

    const CFG = {
      buildings: {
        lumber:   { name: '伐木場', rate: 5, wood: 30, iron: 15 },
        mine:     { name: '鐵礦場', rate: 4, wood: 15, iron: 40 },
        farm:     { name: '農田',   rate: 6, wood: 20, iron: 20 },
        barracks: { name: '兵營',   rate: 0, wood: 60, iron: 60 }
      }
    };

    // 確定性地形生成演算法
    function getTileType(x, y) {
      const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      const rand = v - Math.floor(v);
      if (rand < 0.55) return 'plains';
      if (rand < 0.75) return 'forest';
      if (rand < 0.88) return 'mountain';
      return 'water';
    }

    // 相機邊界限制
    function clampCamera() {
      const viewW = canvas.width / zoom;
      const viewH = canvas.height / zoom;
      const worldW = WORLD_COLS * TILE_SIZE;
      const worldH = WORLD_ROWS * TILE_SIZE;

      const maxCamX = Math.max(0, worldW - viewW);
      const maxCamY = Math.max(0, worldH - viewH);
      camX = Math.max(0, Math.min(camX, maxCamX));
      camY = Math.max(0, Math.min(camY, maxCamY));
    }

    // 將鏡頭聚焦到指定格子
    function centerCameraOn(tileX, tileY) {
      const viewW = canvas.width / zoom;
      const viewH = canvas.height / zoom;
      camX = (tileX * TILE_SIZE + TILE_SIZE / 2) - viewW / 2;
      camY = (tileY * TILE_SIZE + TILE_SIZE / 2) - viewH / 2;
      clampCamera();
      drawWorldMap();
    }

    // 登入與資料監聽
    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      myUid = user.uid;
      const userRef = doc(db, "players", myUid);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
        const initData = {
          name: `領主_${myUid.slice(0, 4)}`,
          x: Math.floor(Math.random() * 40) + 5,
          y: Math.floor(Math.random() * 40) + 5,
          wood: 100, iron: 100, food: 100, troops: 0,
          buildings: { lumber: 1, mine: 1, farm: 1, barracks: 0 },
          buildQueue: null,
          trainQueue: null,
          lastTick: Date.now(),
          logs: ['王國立基於大地之上，沙盤已展開。']
        };
        await setDoc(userRef, initData);
      }

      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          myData = docSnap.data();
          if (!hasCentered) {
            centerCameraOn(myData.x, myData.y);
            hasCentered = true;
          }
          renderSelf();
          drawWorldMap();
        }
      });

      onSnapshot(collection(db, "players"), (querySnap) => {
        allPlayers = [];
        querySnap.forEach((docSnap) => {
          allPlayers.push({ id: docSnap.id, ...docSnap.data() });
        });
        drawWorldMap();
      });

      setInterval(tickAndSync, 1000);
      setInterval(drawWorldMap, 100); // 驅動金色呼吸動畫
    });

    // 惰性數值結算心跳
    async function tickAndSync() {
      if (!myData || !myUid) return;
      const now = Date.now();
      const dt = (now - myData.lastTick) / 1000;
      myData.lastTick = now;

      myData.wood += dt * (CFG.buildings.lumber.rate * myData.buildings.lumber);
      myData.iron += dt * (CFG.buildings.mine.rate * myData.buildings.mine);
      myData.food += dt * (CFG.buildings.farm.rate * myData.buildings.farm);

      let needSave = false;

      if (myData.buildQueue && now >= myData.buildQueue.finishesAt) {
        myData.buildings[myData.buildQueue.target]++;
        myData.logs.unshift(`[建造就緒] ${CFG.buildings[myData.buildQueue.target].name} 升級完成`);
        myData.buildQueue = null;
        needSave = true;
      }

      if (myData.trainQueue && now >= myData.trainQueue.finishesAt) {
        myData.troops += myData.trainQueue.count;
        myData.logs.unshift(`[部隊入營] ${myData.trainQueue.count} 名步兵完成整訓`);
        myData.trainQueue = null;
        needSave = true;
      }

      renderSelf();

      if (needSave || Math.random() < 0.15) {
        await setDoc(doc(db, "players", myUid), myData, { merge: true });
      }
    }

    // Canvas 大地圖主渲染（矩陣變換 + 視錐剔除）
    function drawWorldMap() {
      if (!myData) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(zoom, zoom);
      ctx.translate(-camX, -camY);

      const viewW = canvas.width / zoom;
      const viewH = canvas.height / zoom;

      const startCol = Math.max(0, Math.floor(camX / TILE_SIZE) - 1);
      const endCol   = Math.min(WORLD_COLS, Math.ceil((camX + viewW) / TILE_SIZE) + 1);
      const startRow = Math.max(0, Math.floor(camY / TILE_SIZE) - 1);
      const endRow   = Math.min(WORLD_ROWS, Math.ceil((camY + viewH) / TILE_SIZE) + 1);

      // 1. 繪製地形瓦片
      for (let x = startCol; x < endCol; x++) {
        for (let y = startRow; y < endRow; y++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;
          const type = getTileType(x, y);

          if (type === 'plains') {
            ctx.fillStyle = '#1e3a1e';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#2d5a2d';
            ctx.fillRect(px + 10, py + 12, 3, 6);
            ctx.fillRect(px + 28, py + 34, 4, 7);
          } else if (type === 'forest') {
            ctx.fillStyle = '#142914';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(px + 20, py + 22, 10, 0, Math.PI * 2);
            ctx.arc(px + 36, py + 30, 8, 0, Math.PI * 2);
            ctx.fill();
          } else if (type === 'mountain') {
            ctx.fillStyle = '#262626';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#52525b';
            ctx.beginPath();
            ctx.moveTo(px + 27, py + 10);
            ctx.lineTo(px + 10, py + 45);
            ctx.lineTo(px + 45, py + 45);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#e4e4e7';
            ctx.beginPath();
            ctx.moveTo(px + 27, py + 10);
            ctx.lineTo(px + 20, py + 22);
            ctx.lineTo(px + 34, py + 22);
            ctx.closePath();
            ctx.fill();
          } else if (type === 'water') {
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(px + 8, py + 18, 16, 2);
            ctx.fillRect(px + 24, py + 32, 20, 2);
          }

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
          ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

          if (zoom > 0.6) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.font = '9px sans-serif';
            ctx.fillText(`${x},${y}`, px + 3, py + 11);
          }
        }
      }

      // 2. 繪製城池與高亮標籤
      allPlayers.forEach(p => {
        const isMe = (p.id === myUid);
        const px = p.x * TILE_SIZE;
        const py = p.y * TILE_SIZE;

        if (px < camX - TILE_SIZE || px > camX + viewW + TILE_SIZE ||
            py < camY - TILE_SIZE || py > camY + viewH + TILE_SIZE) {
          return;
        }

        // 金色脈動呼吸光圈與指示標籤
        if (isMe) {
          const pulse = 24 + Math.sin(Date.now() / 250) * 4;
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, pulse, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('▼ 你的王國', px + TILE_SIZE / 2, py - 4);
        }

        ctx.fillStyle = isMe ? 'rgba(37, 99, 235, 0.6)' : 'rgba(220, 38, 38, 0.4)';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = isMe ? '#2563eb' : '#7f1d1d';
        ctx.fillRect(px + 12, py + 16, 31, 26);

        ctx.fillStyle = isMe ? '#60a5fa' : '#b91c1c';
        ctx.fillRect(px + 9, py + 12, 10, 30);
        ctx.fillRect(px + 36, py + 12, 10, 30);

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(px + 10, py + 8, 4, 4);
        ctx.fillRect(px + 41, py + 8, 4, 4);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(px + 22, py + 30, 11, 12);

        // 文字標籤隨視距調整
        if (zoom > 0.5) {
          ctx.fillStyle = isMe ? '#fef08a' : '#ffffff';
          ctx.font = isMe ? 'bold 11px sans-serif' : '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.name + (isMe ? ' (主城)' : ''), px + TILE_SIZE / 2, py + 52);

          ctx.fillStyle = '#fbbf24';
          ctx.font = '10px sans-serif';
          ctx.fillText(`⚔️${p.troops || 0}`, px + TILE_SIZE / 2, py + 8);
        }
        ctx.textAlign = 'start';
      });

      ctx.restore();
    }

    // 互動控制：平移（Pan）、縮放（Zoom）與點擊
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let totalDragDistance = 0;

    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      totalDragDistance = 0;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      totalDragDistance += Math.hypot(dx, dy);

      dragStartX = e.clientX;
      dragStartY = e.clientY;

      camX -= dx / zoom;
      camY -= dy / zoom;
      clampCamera();
      drawWorldMap();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const screenX = (e.clientX - rect.left) * scaleX;
      const screenY = (e.clientY - rect.top) * scaleY;

      const worldX = screenX / zoom + camX;
      const worldY = screenY / zoom + camY;

      const factor = e.deltaY < 0 ? 1.12 : 0.88;
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));

      if (newZoom !== zoom) {
        zoom = newZoom;
        camX = worldX - screenX / zoom;
        camY = worldY - screenY / zoom;
        clampCamera();
        document.getElementById('zoom-indicator').innerText = `縮放: ${Math.round(zoom * 100)}%`;
        drawWorldMap();
      }
    }, { passive: false });

    canvas.addEventListener("click", (e) => {
      if (totalDragDistance > 6) return; // 判定為拖曳漫遊，不觸發點擊操作

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const screenX = (e.clientX - rect.left) * scaleX;
      const screenY = (e.clientY - rect.top) * scaleY;

      const tileX = Math.floor((screenX / zoom + camX) / TILE_SIZE);
      const tileY = Math.floor((screenY / zoom + camY) / TILE_SIZE);

      const target = allPlayers.find(p => p.x === tileX && p.y === tileY);
      if (target) {
        if (target.id === myUid) {
          alert(`👑 這是你的主城 (${target.x}, ${target.y})\n當前防守步兵：${target.troops}`);
        } else {
          const ok = confirm(`偵查到敵對勢力：【${target.name}】\n座標：(${target.x}, ${target.y})\n敵軍約：${target.troops} 步兵\n\n是否派遣 5 名步兵出征討伐？`);
          if (ok) attackPlayer(target.id);
        }
      }
    });

    async function attackPlayer(targetUid) {
      if (myData.troops < 5) return alert('步兵不足 5 名，無法發動遠征！');

      try {
        await runTransaction(db, async (transaction) => {
          const targetRef = doc(db, "players", targetUid);
          const targetDoc = await transaction.get(targetRef);
          if (!targetDoc.exists()) throw new Error("該城池已被廢棄");

          const target = targetDoc.data();
          const attackerTroops = 5;
          const defenderTroops = target.troops || 0;

          if (attackerTroops > defenderTroops) {
            const lootWood = Math.floor(target.wood * 0.3);
            const lootIron = Math.floor(target.iron * 0.3);

            transaction.update(targetRef, {
              wood: target.wood - lootWood,
              iron: target.iron - lootIron,
              troops: 0,
              logs: [`[城防告急] 遭到 ${myData.name} 破城！被掠奪木材 ${lootWood}、鐵礦 ${lootIron}`, ...(target.logs || [])]
            });

            myData.wood += lootWood;
            myData.iron += lootIron;
            myData.logs.unshift(`[凱旋而歸] 攻克 ${target.name}，帶回木材 ${lootWood}、鐵礦 ${lootIron}！`);
          } else {
            myData.troops -= 5;
            transaction.update(targetRef, {
              troops: Math.max(0, defenderTroops - 2),
              logs: [`[堅壁清野] 成功擊退來自 ${myData.name} 的入侵先鋒！`, ...(target.logs || [])]
            });
            myData.logs.unshift(`[征戰失利] 突擊 ${target.name} 遭受伏擊，5 名步兵陣亡！`);
          }

          transaction.set(doc(db, "players", myUid), myData, { merge: true });
        });
        drawWorldMap();
      } catch (err) {
        alert("指令失敗：" + err.message);
      }
    }

    function renderSelf() {
      document.getElementById('player-title').innerText = `🏰 ${myData.name} 的王國 (${myData.x}, ${myData.y})`;
      document.getElementById('res-wood').innerText = Math.floor(myData.wood);
      document.getElementById('res-iron').innerText = Math.floor(myData.iron);
      document.getElementById('res-food').innerText = Math.floor(myData.food);
      document.getElementById('res-troops').innerText = myData.troops;

      const bContainer = document.getElementById('building-container');
      bContainer.innerHTML = Object.entries(myData.buildings).map(([key, lvl]) => {
        const nextWood = CFG.buildings[key].wood * (lvl + 1);
        const nextIron = CFG.buildings[key].iron * (lvl + 1);
        return `
          <div class="item-card">
            <div>
              <strong>${CFG.buildings[key].name}</strong> (Lv.${lvl})
              <div style="font-size:0.8rem; color:#94a3b8; margin:4px 0;">升級需: 🌲${nextWood} ⛏️${nextIron}</div>
            </div>
            <button onclick="window.upgradeBuilding('${key}')" ${myData.buildQueue ? 'disabled' : ''}>升級 (6s)</button>
          </div>
        `;
      }).join('');

      const now = Date.now();
      let qMsg = [];
      if (myData.buildQueue) qMsg.push(`🏗️ 設施升級中... (${Math.max(0, Math.ceil((myData.buildQueue.finishesAt - now)/1000))}s)`);
      if (myData.trainQueue) qMsg.push(`⚔️ 士兵整訓中... (${Math.max(0, Math.ceil((myData.trainQueue.finishesAt - now)/1000))}s)`);
      document.getElementById('queue-status').innerText = qMsg.join(' | ');

      document.getElementById('log-list').innerHTML = myData.logs.slice(0, 6).map(l => `<p>${l}</p>`).join('');
    }

    window.locateHome = () => {
      if (!myData) return;
      centerCameraOn(myData.x, myData.y);
    };

    window.upgradeBuilding = async (key) => {
      if (myData.buildQueue) return;
      const lvl = myData.buildings[key];
      const wCost = CFG.buildings[key].wood * (lvl + 1);
      const iCost = CFG.buildings[key].iron * (lvl + 1);
      if (myData.wood < wCost || myData.iron < iCost) return alert('資源不足！');

      myData.wood -= wCost;
      myData.iron -= iCost;
      myData.buildQueue = { target: key, finishesAt: Date.now() + 6000 };
      await setDoc(doc(db, "players", myUid), myData, { merge: true });
    };

    window.trainTroops = async () => {
      if (myData.trainQueue) return;
      if (myData.buildings.barracks < 1) return alert('請先建造兵營！');
      if (myData.wood < 40 || myData.iron < 30) return alert('資源不足！');

      myData.wood -= 40;
      myData.iron -= 30;
      myData.trainQueue = { count: 5, finishesAt: Date.now() + 5000 };
      await setDoc(doc(db, "players", myUid), myData, { merge: true });
    };
  </script>
</body>
</html>
