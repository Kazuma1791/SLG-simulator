<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人領地戰 - Firebase SLG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #111827; color: #f3f4f6; padding: 16px; }
    .container { max-width: 850px; margin: 0 auto; }
    .card { background: #1f2937; border-radius: 8px; padding: 16px; margin-bottom: 14px; border: 1px solid #374151; }
    h2, h3 { color: #60a5fa; margin-bottom: 12px; }
    .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
    .res-box { background: #111827; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #374151; }
    .res-box span { font-weight: bold; font-size: 1.15rem; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .item-card { background: #111827; padding: 12px; border-radius: 6px; border: 1px solid #374151; display: flex; flex-direction: column; justify-content: space-between; }
    button { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    .danger-btn { background: #dc2626; }
    .danger-btn:hover:not(:disabled) { background: #b91c1c; }
    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #111827; border-radius: 6px; margin-bottom: 8px; border: 1px solid #374151; }
    .log-box { background: #030712; padding: 10px; border-radius: 6px; max-height: 120px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #1f2937; }
    .log-box p { margin-bottom: 4px; border-bottom: 1px solid #111827; padding-bottom: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 id="player-title">🏰 載入領地中...</h2>
      <div class="res-grid">
        <div class="res-box">🌲 木材<br><span id="res-wood">0</span></div>
        <div class="res-box">⛏️ 鐵礦<br><span id="res-iron">0</span></div>
        <div class="res-box">🌾 糧食<br><span id="res-food">0</span></div>
        <div class="res-box">🛡️ 步兵<br><span id="res-troops">0</span></div>
      </div>
      <div id="queue-status" style="color: #f59e0b; font-size: 0.9rem; min-height: 20px;"></div>
    </div>

    <div class="card">
      <h3>基地建設與徵兵</h3>
      <div class="grid" id="building-container"></div>
      <div style="margin-top: 12px;">
        <button id="train-btn" onclick="trainTroops()">招募 5 名步兵 (木40 鐵30，耗時 5 秒)</button>
      </div>
    </div>

    <div class="card">
      <h3>🌍 世界大地圖（即時在線領主）</h3>
      <div id="world-container">正在搜索世界鄰邦...</div>
    </div>

    <div class="card">
      <h3>戰報與領地紀錄</h3>
      <div class="log-box" id="log-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, onSnapshot, collection, runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. 請替換為你自己在 Firebase 控制台複製的設定
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid = null;
    let myData = null;

    const CFG = {
      buildings: {
        lumber:   { name: '伐木場', rate: 5, wood: 30, iron: 15 },
        mine:     { name: '鐵礦場', rate: 4, wood: 15, iron: 40 },
        farm:     { name: '農田',   rate: 6, wood: 20, iron: 20 },
        barracks: { name: '兵營',   rate: 0, wood: 60, iron: 60 }
      }
    };

    // 2. 匿名登入與資料初始化
    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      myUid = user.uid;
      const userRef = doc(db, "players", myUid);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
        const initData = {
          name: `領主_${myUid.slice(0, 4)}`,
          x: Math.floor(Math.random() * 50) + 1,
          y: Math.floor(Math.random() * 50) + 1,
          wood: 100, iron: 100, food: 100, troops: 0,
          buildings: { lumber: 1, mine: 1, farm: 1, barracks: 0 },
          buildQueue: null,
          trainQueue: null,
          lastTick: Date.now(),
          logs: ['城堡建立，旗幟已在此插下。']
        };
        await setDoc(userRef, initData);
      }

      // 即時監聽自己的資料變化（包含被其他玩家掠奪後的即時反應）
      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          myData = docSnap.data();
          renderSelf();
        }
      });

      // 即時監聽全服其他玩家狀態
      onSnapshot(collection(db, "players"), (querySnap) => {
        const others = [];
        querySnap.forEach((docSnap) => {
          if (docSnap.id !== myUid) {
            others.push({ id: docSnap.id, ...docSnap.data() });
          }
        });
        renderWorld(others);
      });

      // 啟動本機惰性計算與定期同步心跳
      setInterval(tickAndSync, 1000);
    });

    // 3. 惰性資源計算與隊列結算
    async function tickAndSync() {
      if (!myData || !myUid) return;
      const now = Date.now();
      const dt = (now - myData.lastTick) / 1000;
      myData.lastTick = now;

      // 生產資源
      myData.wood += dt * (CFG.buildings.lumber.rate * myData.buildings.lumber);
      myData.iron += dt * (CFG.buildings.mine.rate * myData.buildings.mine);
      myData.food += dt * (CFG.buildings.farm.rate * myData.buildings.farm);

      let needSave = false;

      // 建築隊列結算
      if (myData.buildQueue && now >= myData.buildQueue.finishesAt) {
        myData.buildings[myData.buildQueue.target]++;
        myData.logs.unshift(`[建造完成] ${CFG.buildings[myData.buildQueue.target].name} 升級完成`);
        myData.buildQueue = null;
        needSave = true;
      }

      // 徵兵隊列結算
      if (myData.trainQueue && now >= myData.trainQueue.finishesAt) {
        myData.troops += myData.trainQueue.count;
        myData.logs.unshift(`[軍隊訓練] ${myData.trainQueue.count} 名步兵入伍待命`);
        myData.trainQueue = null;
        needSave = true;
      }

      renderSelf();

      // 每 8 秒或有事件完成時向 Firebase 寫入一次存檔
      if (needSave || Math.random() < 0.15) {
        await setDoc(doc(db, "players", myUid), myData, { merge: true });
      }
    }

    // 4. 前端渲染邏輯
    function renderSelf() {
      document.getElementById('player-title').innerText = `🏰 ${myData.name} 的城堡 (${myData.x}, ${myData.y})`;
      document.getElementById('res-wood').innerText = Math.floor(myData.wood);
      document.getElementById('res-iron').innerText = Math.floor(myData.iron);
      document.getElementById('res-food').innerText = Math.floor(myData.food);
      document.getElementById('res-troops').innerText = myData.troops;

      // 建築渲染
      const bContainer = document.getElementById('building-container');
      bContainer.innerHTML = Object.entries(myData.buildings).map(([key, lvl]) => {
        const nextWood = CFG.buildings[key].wood * (lvl + 1);
        const nextIron = CFG.buildings[key].iron * (lvl + 1);
        return `
          <div class="item-card">
            <div>
              <strong>${CFG.buildings[key].name}</strong> (Lv.${lvl})
              <div style="font-size:0.8rem; color:#9ca3af; margin:4px 0;">升級需: 🌲${nextWood} ⛏️${nextIron}</div>
            </div>
            <button onclick="window.upgradeBuilding('${key}')" ${myData.buildQueue ? 'disabled' : ''}>升級 (需6秒)</button>
          </div>
        `;
      }).join('');

      // 佇列進度
      const now = Date.now();
      let qMsg = [];
      if (myData.buildQueue) {
        qMsg.push(`🏗️ ${CFG.buildings[myData.buildQueue.target].name} 升級中 (${Math.max(0, Math.ceil((myData.buildQueue.finishesAt - now)/1000))}s)`);
      }
      if (myData.trainQueue) {
        qMsg.push(`⚔️ 步兵招募中 (${Math.max(0, Math.ceil((myData.trainQueue.finishesAt - now)/1000))}s)`);
      }
      document.getElementById('queue-status').innerText = qMsg.join(' | ');

      // 戰報日誌
      document.getElementById('log-list').innerHTML = myData.logs.slice(0, 8).map(l => `<p>${l}</p>`).join('');
    }

    function renderWorld(others) {
      const container = document.getElementById('world-container');
      if (others.length === 0) {
        container.innerHTML = '<p style="color:#9ca3af;">方圓百里內沒有其他領主（你可以開一個無痕視窗扮演另一名玩家）</p>';
        return;
      }
      container.innerHTML = others.map(p => `
        <div class="player-row">
          <div>
            <strong>${p.name}</strong> 座標: (${p.x}, ${p.y})<br>
            <span style="font-size: 0.85rem; color: #9ca3af;">駐軍: ${p.troops} 兵力 | 儲備物資估算中</span>
          </div>
          <button class="danger-btn" onclick="window.attackPlayer('${p.id}')">派遣 5 名步兵突襲</button>
        </div>
      `).join('');
    }

    // 5. 跨玩家戰鬥與交易事務（Firestore runTransaction 保證並發安全）
    window.upgradeBuilding = async (key) => {
      if (myData.buildQueue) return;
      const lvl = myData.buildings[key];
      const wCost = CFG.buildings[key].wood * (lvl + 1);
      const iCost = CFG.buildings[key].iron * (lvl + 1);
      if (myData.wood < wCost || myData.iron < iCost) return alert('資源不足！');

      myData.wood -= wCost;
      myData.iron -= iCost;
      myData.buildQueue = { target: key, finishesAt: Date.now() + 6000 };
      await setDoc(doc(db, "players", myUid), myData, { merge: true });
    };

    window.trainTroops = async () => {
      if (myData.trainQueue) return;
      if (myData.buildings.barracks < 1) return alert('請先建造兵營！');
      if (myData.wood < 40 || myData.iron < 30) return alert('資源不足！');

      myData.wood -= 40;
      myData.iron -= 30;
      myData.trainQueue = { count: 5, finishesAt: Date.now() + 5000 };
      await setDoc(doc(db, "players", myUid), myData, { merge: true });
    };

    window.attackPlayer = async (targetUid) => {
      if (myData.troops < 5) return alert('至少需要 5 名步兵才能發動進攻！');

      // 使用 Firestore 事務同時修改攻擊方與被攻擊方數據，防止數據不同步
      try {
        await runTransaction(db, async (transaction) => {
          const targetRef = doc(db, "players", targetUid);
          const targetDoc = await transaction.get(targetRef);
          if (!targetDoc.exists()) throw new Error("目標領主已棄城離去");

          const target = targetDoc.data();
          const attackerTroops = 5;
          const defenderTroops = target.troops || 0;

          if (attackerTroops > defenderTroops) {
            // 戰勝：掠奪目標 30% 資源
            const lootWood = Math.floor(target.wood * 0.3);
            const lootIron = Math.floor(target.iron * 0.3);

            transaction.update(targetRef, {
              wood: target.wood - lootWood,
              iron: target.iron - lootIron,
              troops: 0,
              logs: [`[遭到突襲] 被 ${myData.name} 攻破，損失步兵，被搶走木材 ${lootWood}、鐵礦 ${lootIron}！`, ...(target.logs || [])]
            });

            myData.wood += lootWood;
            myData.iron += lootIron;
            myData.logs.unshift(`[大捷] 成功攻陷 ${target.name}，掠奪木材 ${lootWood}、鐵礦 ${lootIron}！`);
          } else {
            // 潰敗：扣除進攻兵力
            myData.troops -= 5;
            transaction.update(targetRef, {
              troops: Math.max(0, defenderTroops - 2),
              logs: [`[守城大捷] 成功擊退來自 ${myData.name} 的入侵部隊！`, ...(target.logs || [])]
            });
            myData.logs.unshift(`[遠征失利] 進攻 ${target.name} 遭遇重創，5 名步兵陣亡！`);
          }

          transaction.set(doc(db, "players", myUid), myData, { merge: true });
        });
        alert('戰事結算完成！請查看最新戰報。');
      } catch (err) {
        console.error("攻擊失敗:", err);
        alert("作戰未執行: " + err.message);
      }
    };
  </script>
</body>
</html>
