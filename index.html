<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多人領地戰 - 巨型世界與戰略冷卻版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
    body { background: #070b14; color: #f1f5f9; padding: 8px; overflow-x: hidden; }
    .container { max-width: 1000px; margin: 0 auto; position: relative; }
    .card { background: #131d2e; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #23354d; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2, h3 { color: #38bdf8; margin-bottom: 6px; font-size: 1.05rem; }
    
    .res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; margin-bottom: 4px; }
    .res-box { background: #0a0f1d; padding: 6px; border-radius: 6px; text-align: center; border: 1px solid #1e2c40; position: relative; }
    .res-box span.title { font-size: 0.75rem; color: #94a3b8; }
    .res-box span.val { font-weight: bold; font-size: 1.05rem; color: #38bdf8; display: block; margin-top: 2px; }
    .res-box span.rate { font-size: 0.65rem; display: block; margin-top: 1px; color: #10b981; }
    
    button { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.1s; font-size: 0.85rem; }
    button:disabled { background: #334155; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 2px solid #1e2c40; padding-bottom: 6px; flex-wrap: wrap; }
    .tab-btn { background: transparent; color: #94a3b8; border: 1px solid transparent; font-size: 0.9rem; padding: 6px 4px; flex: 1; text-align: center; min-width: 65px; }
    .tab-btn.active { background: #1e2c40; color: #38bdf8; border: 1px solid #38bdf8; border-radius: 6px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 🌍 巨型地圖框 */
    .map-frame { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid #2e4461; background: #050811; width: 100%; height: 68vh; min-height: 480px; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    
    .zoom-controls { position: absolute; bottom: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
    .zoom-btn { background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; color: #fff; width: 40px; height: 40px; border-radius: 8px; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    
    .hud-tooltip { position: absolute; display: none; pointer-events: none; background: rgba(10, 15, 29, 0.95); border: 1px solid #38bdf8; padding: 8px 12px; border-radius: 6px; color: #f1f5f9; font-size: 0.85rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; white-space: nowrap; }
    .hud-tooltip h4 { color: #facc15; margin-bottom: 4px; font-size: 0.9rem; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 50; display: none; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
    .action-modal { background: #131d2e; border: 2px solid #475569; border-radius: 12px; padding: 20px; text-align: center; width: 90%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
    .action-modal h3 { color: #f87171; margin-bottom: 12px; font-size: 1.2rem; }
    .action-modal p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 12px; line-height: 1.5; }
    .action-modal .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    
    .troop-input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #0a0f1d; padding: 8px 12px; border-radius: 6px; border: 1px solid #1e2c40; font-size: 0.9rem; }
    .troop-input-row input, .rename-input { width: 70px; background: #1e2c40; color: white; border: 1px solid #475569; padding: 6px; border-radius: 4px; text-align: right; font-size: 1rem; }
    .rename-input { width: 100%; text-align: left; margin-bottom: 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .item-card { background: linear-gradient(145deg, #0f172a, #1e293b); padding: 12px; border-radius: 8px; border: 1px solid #334155; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;}
    .item-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #3b82f6; }
    
    .log-box { background: #050811; padding: 10px; border-radius: 6px; max-height: 120px; overflow-y: auto; font-size: 0.8rem; border: 1px solid #182333; }
    .log-box p { margin-bottom: 6px; border-bottom: 1px solid #0d1522; padding-bottom: 4px; line-height: 1.3; }
    
    .danger-border { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 9999; box-shadow: inset 0 0 25px 8px rgba(239, 68, 68, 0.8); animation: flashRed 1.2s infinite alternate; display: none; border: 2px solid #ef4444; }
    @keyframes flashRed { from { opacity: 0.2; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="danger-overlay" class="danger-border"></div>

  <div class="container">
    <div id="login-panel" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 11, 20, 0.95); z-index: 1000; display: flex; justify-content: center; align-items: center;">
      <div style="background: #131d2e; padding: 30px; border-radius: 8px; border: 1px solid #23354d; width: 90%; max-width: 320px; text-align: center;">
        <h2 style="color: #38bdf8; margin-bottom: 20px;">🏰 領地戰登入</h2>
        <input type="email" id="email-input" placeholder="信箱 (Email)" style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 4px; border: none; background: #0a0f1d; color: white;">
        <input type="password" id="password-input" placeholder="密碼 (至少6碼)" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; border: none; background: #0a0f1d; color: white;">
        <button onclick="loginUser()" style="width: 100%; background: #2563eb; margin-bottom: 10px;">登入遊戲</button>
        <button onclick="registerUser()" style="width: 100%; background: #059669;">註冊新帳號</button>
      </div>
    </div>

    <div id="rename-modal" class="modal-overlay">
      <div class="action-modal">
        <h3 style="color:#38bdf8;">✏️ 更改名稱</h3>
        <p id="rename-desc">首次改名免費，之後需消耗改名卡。</p>
        <input type="text" id="rename-input" class="rename-input" placeholder="輸入新名稱 (2-8字)">
        <div class="btn-group">
          <button style="background: #475569; flex: 1;" onclick="closeRenameModal()">取消</button>
          <button style="background: #0ea5e9; flex: 1;" onclick="confirmRename()">確認</button>
        </div>
      </div>
    </div>

    <div class="card" style="padding-bottom: 8px;">
      <h2 id="player-title" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <span style="font-size:1.1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🏰 連線中...</span>
        <button onclick="openRenameModal()" style="background:#334155; padding:5px 10px; font-size:0.75rem;">✏️ 改名</button>
      </h2>
      <div class="res-grid">
        <div class="res-box"><span class="title">🌲 木材</span><span class="val" id="res-wood">0</span><span class="rate" id="rate-wood">+0/h</span></div>
        <div class="res-box"><span class="title">⛏️ 鐵礦</span><span class="val" id="res-iron">0</span><span class="rate" id="rate-iron">+0/h</span></div>
        <div class="res-box" style="border-color:#10b981;"><span class="title">🌾 糧草</span><span class="val" id="res-food">0</span><span class="rate" id="rate-food" style="color:#10b981;">+0/h</span></div>
        <div class="res-box" style="border-color:#3b82f6;"><span class="title">🛡️ 步兵</span><span class="val" id="res-inf">0</span></div>
        <div class="res-box" style="border-color:#8b5cf6;"><span class="title">🏹 弓兵</span><span class="val" id="res-arc">0</span></div>
        <div class="res-box" style="border-color:#f59e0b;"><span class="title">🐎 騎兵</span><span class="val" id="res-cav">0</span></div>
        <div class="res-box" style="border-color:#0ea5e9;"><span class="title">⏳ 加速</span><span class="val" id="res-speedup">0</span></div>
      </div>
      <div id="queue-status" style="color: #f59e0b; font-size: 0.8rem; min-height: 18px; margin-top:2px;"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="btn-tab-world" onclick="switchTab('world')">🌍 世界沙盤</button>
      <button class="tab-btn" id="btn-tab-city" onclick="switchTab('city')">🏰 城內政務</button>
      <button class="tab-btn" id="btn-tab-players" onclick="switchTab('players')">👥 領主雷達</button>
      <button onclick="logoutUser()" style="background:#dc2626; margin-left:auto; padding:6px 10px; font-size:0.8rem;">🚪 登出</button>
    </div>

    <div id="tab-world" class="tab-content active">
      <div class="card" style="padding: 10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <button id="btn-toggle-fog" onclick="toggleFogMode()" style="background:#7c3aed; padding:4px 8px; font-size:0.75rem; border-radius:4px;">👁️ 關閉迷霧</button>
          </div>
          <div style="display:flex; gap:6px;">
            <button onclick="dispatchScout()" style="background:#059669; padding:6px 10px; font-size:0.8rem;">🦅 斥候(30糧)</button>
            <button onclick="locateHome()" style="background:#475569; padding:6px 10px; font-size:0.8rem;">📍 回城</button>
          </div>
        </div>
        
        <div class="map-frame" id="map-frame">
          <canvas id="worldCanvas"></canvas>
          
          <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomMapBtn(1.3)">+</button>
            <button class="zoom-btn" onclick="zoomMapBtn(0.7)">-</button>
            <div style="text-align:center; color:#94a3b8; font-size:0.75rem; margin-top:2px;" id="zoom-indicator">100%</div>
          </div>

          <div id="hover-hud" class="hud-tooltip"><h4 id="hud-title">地形資訊</h4><div id="hud-content">座標: (0, 0)</div></div>

          <div id="action-modal" class="modal-overlay">
            <div class="action-modal">
              <h3 id="modal-title">⚔️ 軍事行動</h3>
              <p id="modal-desc" style="border-bottom: 1px solid #334155; padding-bottom: 10px;"></p>
              
              <div id="troop-selector" style="text-align: left; margin-top: 10px; display: none;">
                <div class="troop-input-row" id="row-inf"><span>🛡️ 步兵 (剩 <span id="avail-inf">0</span>)</span><input type="number" id="send-inf" min="0" value="0"></div>
                <div class="troop-input-row" id="row-arc"><span>🏹 弓兵 (剩 <span id="avail-arc">0</span>)</span><input type="number" id="send-arc" min="0" value="0"></div>
                <div class="troop-input-row" id="row-cav"><span>🐎 騎兵 (剩 <span id="avail-cav">0</span>)</span><input type="number" id="send-cav" min="0" value="0"></div>
                <p id="troop-lock-msg" style="color:#ef4444; font-size:0.75rem; margin-top:5px; display:none;">部分兵種需提升兵營等級解鎖。</p>
              </div>

              <div class="btn-group">
                <button style="background: #475569; flex: 1;" onclick="closeActionModal()">取消</button>
                <button id="btn-confirm-action" style="background: #dc2626; flex: 1;">確認執行</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 城內政務 -->
    <div id="tab-city" class="tab-content">
      <div class="card">
        <h3 style="display: flex; justify-content: space-between; align-items:center; border-bottom: 1px solid #1e2c40; padding-bottom: 8px; margin-bottom: 12px;">
          <span>⚒️ 基礎設施營造 <span style="font-size:0.8rem; color:#94a3b8;" id="build-queue-text">(0/1)</span></span>
          <button onclick="useSpeedUp('build')" style="background:#10b981; font-size:0.8rem; padding:6px 10px;">⏳ 加速(5m)</button>
        </h3>
        <div class="grid" id="building-container"></div>
      </div>

      <div class="card">
        <h3 style="display: flex; justify-content: space-between; align-items:center; border-bottom: 1px solid #1e2c40; padding-bottom: 8px; margin-bottom: 12px;">
          <span>🧪 軍事學院 (科技研發)</span>
          <button onclick="useSpeedUp('research')" style="background:#10b981; font-size:0.8rem; padding:6px 10px;">⏳ 加速(5m)</button>
        </h3>
        <div class="grid" id="research-container"></div>
      </div>

      <div class="card">
        <h3 style="display: flex; justify-content: space-between; align-items:center; border-bottom: 1px solid #1e2c40; padding-bottom: 8px; margin-bottom: 12px;">
          <span>⚔️ 軍事招募所</span>
          <button onclick="useSpeedUp('train')" style="background:#10b981; font-size:0.8rem; padding:6px 10px;">⏳ 加速(5m)</button>
        </h3>
        <div class="grid" id="train-container"></div>
      </div>
    </div>

    <!-- 附近領主 -->
    <div id="tab-players" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items:center; border-bottom: 1px solid #1e2c40; padding-bottom: 8px;">
          <h3 style="margin:0;">👥 附近勢力雷達</h3>
          <button onclick="window.refreshMap()" style="background:#475569; font-size:0.75rem; padding:4px 8px;">🔄 重新掃描</button>
        </div>
        <div id="players-list-container" style="display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height: 50vh; overflow-y: auto;">
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 6px;">📜 王國日誌</h3>
      <div class="log-box" id="log-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, onSnapshot, collection, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaowUN5atHnnlfvGmfWA0PDyjfQU3Qr0U",
      authDomain: "slg-game-617b3.firebaseapp.com",
      projectId: "slg-game-617b3",
      storageBucket: "slg-game-617b3.firebasestorage.app",
      messagingSenderId: "418102371703",
      appId: "1:418102371703:web:d872ccee572039b65d2d72"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid = null, myData = null, allCastles = [], worldBoss = null, hasCentered = false;
    let godModeFog = false; 
    let isAdmin = false; // 管理員特權判定

    // 💡 巨型地圖 100x100 (10000格)
    const TILE_SIZE = 55, WORLD_COLS = 100, WORLD_ROWS = 100, BASE_VISION_RADIUS = 5;
    const RELOCATE_COOLDOWN = 12 * 60 * 60 * 1000; // 💡 12 小時冷卻
    let currentVisionBonus = 0, camX = 0, camY = 0, zoom = 1.0;
    const MIN_ZOOM = 0.20, MAX_ZOOM = 2.0;

    const canvas = document.getElementById("worldCanvas"), ctx = canvas.getContext("2d");
    let MAP_CACHE = [];
    const exploredTiles = Array.from({ length: WORLD_COLS }, () => Array(WORLD_ROWS).fill(false));

    // 💡 建築配置與科技研發樹
    const CFG = {
      buildings: { 
        castle:   { name: '主城',     rate: 0,   baseW: 600, baseI: 600, baseTime: 120, maxLevel: 99 },
        academy:  { name: '學院',     rate: 0,   baseW: 400, baseI: 400, baseTime: 180, maxLevel: 99 },
        builder:  { name: '工匠小屋', rate: 0,   baseW: 2000, baseI: 2000, baseTime: 300, maxLevel: 3 }, 
        lumber:   { name: '伐木場',   rate: 1.0, baseW: 100, baseI: 50,  baseTime: 60, maxLevel: 99 }, 
        mine:     { name: '鐵礦場',   rate: 0.8, baseW: 50,  baseI: 100, baseTime: 60, maxLevel: 99 }, 
        farm:     { name: '農田',     rate: 1.2, baseW: 80,  baseI: 80,  baseTime: 60, maxLevel: 99 }, 
        barracks: { name: '兵營',     rate: 0,   baseW: 200, baseI: 200, baseTime: 90, maxLevel: 99 } 
      },
      techs: {
        infantry_atk: { name: '步兵鍛甲', icon: '🛡️', baseW: 300, baseI: 300, baseTime: 300 },
        archer_atk:   { name: '弓兵矢志', icon: '🏹', baseW: 300, baseI: 300, baseTime: 300 },
        cavalry_atk:  { name: '騎術改良', icon: '🐎', baseW: 300, baseI: 300, baseTime: 300 }
      },
      troops: {
        infantry: { icon: '🛡️', name: '重裝步兵', w: 40, i: 30, f: 0,  pwr: 1, speed: 6, time: 5, reqLvl: 1, upkeep: 10 },
        archer:   { icon: '🏹', name: '長弓射手', w: 60, i: 10, f: 20, pwr: 2, speed: 4, time: 8, reqLvl: 3, upkeep: 25 },
        cavalry:  { icon: '🐎', name: '驃騎兵',   w: 20, i: 80, f: 60, pwr: 3, speed: 2, time: 12, reqLvl: 5, upkeep: 45 }
      },
      bosses: [
        { name: '🐉 滅世魔龍', hp: 50000 }, { name: '🦅 風暴巨鷹', hp: 40000 },
        { name: '🦑 深海巨妖', hp: 60000 }, { name: '🗿 大地岩魔', hp: 80000 }
      ]
    };

    function getUpgradeCost(key, level, isTech=false) { const base = isTech ? CFG.techs[key] : CFG.buildings[key]; const m = Math.pow(1.6, level); return { w: Math.floor(base.baseW * m), i: Math.floor(base.baseI * m) }; }
    function getUpgradeTime(key, level, isTech=false) { const base = isTech ? CFG.techs[key].baseTime : (CFG.buildings[key].baseTime || 60); return Math.floor(base * Math.pow(1.6, Math.max(0, level - 1))); }
    function formatTime(sec) {
      if (sec < 60) return sec + 's';
      if (sec < 3600) return Math.floor(sec/60) + 'm' + (sec%60 > 0 ? ' '+(sec%60)+'s' : '');
      return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
    }

    function getTileTypeRaw(x, y) {
      const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; const rand = v - Math.floor(v);
      if (rand < 0.55) return 'plains'; if (rand < 0.75) return 'forest'; if (rand < 0.88) return 'mountain'; return 'water';
    }

    function getStaticEntity(x, y, type) {
      // 💡 絕對中心點更改為 50, 50
      if (x === 50 && y === 50) return { type: 'npc_capital', name: '😈 黑暗王城', reqPwr: 1500, loot: { wood: 10000, iron: 10000, food: 10000, speedup: 5 } };
      if (type === 'water') return null;
      
      const dist = Math.hypot(x - 50, y - 50);
      const v = Math.sin(x * 45.123 + y * 89.456) * 98765.4321; const rand = v - Math.floor(v); 
      
      // 💡 按比例放大的生態分佈
      if (dist <= 14) {
        if (rand < 0.015) return { type: 'npc_fortress', name: '🏯 黑暗要塞', reqPwr: 500, loot: { wood: 3000, iron: 3000, food: 3000 } };
        if (rand < 0.050) return { type: 'barbarian', name: '👹 黑暗禁衛', reqPwr: 300, loot: { iron: 2000, wood: 1000 } };
        if (rand < 0.090) return { type: 'relic', name: '🏛️ 奇蹟遺跡', reqFood: 200, loot: { wood: 1500, iron: 1500, food: 1500 } };
        return null;
      }
      if (dist <= 32) {
        if (rand < 0.010) return { type: 'npc_castle', name: '🏰 黑暗城堡', reqPwr: 200, loot: { wood: 1500, iron: 1500, food: 1500 } };
        if (rand < 0.040) return { type: 'barbarian', name: '👹 狂暴野蠻人', reqPwr: 80, loot: { iron: 800, wood: 400 } };
        if (rand < 0.070) return { type: 'relic', name: '🏛️ 遠古遺跡', reqFood: 100, loot: { wood: 600, iron: 600, food: 600 } };
        if (rand < 0.110) return { type: 'bandit', name: '⛺ 精銳流寇', reqPwr: 20, loot: { wood: 300, food: 300 } };
        return null;
      }
      if (rand < 0.005) return { type: 'npc_outpost', name: '🏚️ 黑暗前哨', reqPwr: 80, loot: { wood: 800, iron: 800, food: 800 } };
      if (rand < 0.025) return { type: 'barbarian', name: '👹 野蠻人部落', reqPwr: 25, loot: { iron: 300, wood: 100 } };
      if (rand < 0.055) return { type: 'bandit', name: '⛺ 流寇營地', reqPwr: 5, loot: { wood: 120, food: 80 } };
      if (rand < 0.075) return { type: 'relic', name: '🏛️ 破碎遺跡', reqFood: 30, loot: { wood: 150, iron: 150, food: 150 } };
      return null;
    }

    function initMapCache() {
      for(let x=0; x<WORLD_COLS; x++) {
        MAP_CACHE[x] = [];
        for(let y=0; y<WORLD_ROWS; y++) {
          let t = getTileTypeRaw(x,y);
          if (x===50 && y===50) t = 'plains'; 
          MAP_CACHE[x][y] = { type: t, entity: getStaticEntity(x,y,t) };
        }
      }
    }
    initMapCache();

    function getTileEntity(x, y) {
      if (x < 0 || x >= WORLD_COLS || y < 0 || y >= WORLD_ROWS) return null;
      if (allCastles.some(p => p.x === x && p.y === y)) return null;
      if (worldBoss && worldBoss.hp > 0 && worldBoss.x === x && worldBoss.y === y) return null;
      return MAP_CACHE[x][y].entity;
    }

    function getClearedPOI(x, y) {
      if (!myData || !myData.clearedPOI) return null;
      const found = myData.clearedPOI.find(poi => poi === `${x},${y}` || poi.startsWith(`${x},${y},`));
      if (!found) return null; const pts = found.split(','); return { x: parseInt(pts[0]), y: parseInt(pts[1]), time: pts[2] ? parseInt(pts[2]) : 0, type: pts[3] || 'unknown' };
    }

    async function spawnWorldBoss() {
      let bx, by; do { bx = Math.floor(Math.random() * 30) + 35; by = Math.floor(Math.random() * 30) + 35; } while(bx === 50 && by === 50); 
      const b = CFG.bosses[Math.floor(Math.random() * CFG.bosses.length)];
      await setDoc(doc(db, "world_map", "WORLD_BOSS"), { name: b.name, isBoss: true, x: bx, y: by, hp: b.hp, maxHp: b.hp, despawnAt: Date.now() + 6 * 3600 * 1000 });
    }

    window.toggleFogMode = () => {

    };

    window.registerUser = () => {

    window.logoutUser = () => { if (confirm("確定登出？")) signOut(auth).then(() => location.reload()); };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById("login-panel").style.display = "none";
        myUid = user.uid;
        const playerRef = doc(db, "players", myUid), worldRef = doc(db, "world_map", myUid);
        const pSnap = await getDoc(playerRef), wSnap = await getDoc(worldRef);
        
        let d = null;
        if (!pSnap.exists()) {
          // 強制降生在外圍 (距離中心 50,50 > 32 格)
          let startX, startY; do { startX = Math.floor(Math.random() * 80) + 10; startY = Math.floor(Math.random() * 80) + 10; } while (Math.hypot(startX - 50, startY - 50) <= 32);
          d = {
            name: `領主_${myUid.slice(0, 4)}`, x: startX, y: startY,
            wood: 200, iron: 200, food: 200, troops: { infantry: 10, archer: 0, cavalry: 0 },
            buildings: { castle: 1, builder: 0, academy: 0, lumber: 1, mine: 1, farm: 1, barracks: 1 },
            research: { infantry_atk: 0, archer_atk: 0, cavalry_atk: 0 },
            items: { speedup: 3, renameCard: 0, resourceCard: 0 }, freeRenameUsed: false, lastRelocateTime: 0,
            buildQueues: [], researchQueue: null, trainQueue: null, lastTick: Date.now(), clearedPOI: [], marches: [], logs: ['降生於大陸邊陲地帶。']
          };
          await setDoc(playerRef, d);
        } else {
          d = pSnap.data();
          if (typeof d.troops === 'number') d.troops = { infantry: d.troops, archer: 0, cavalry: 0 };
          if (!d.items) d.items = { speedup: 3, renameCard: 0, resourceCard: 0 }; 
          if (d.freeRenameUsed === undefined) d.freeRenameUsed = false;
          if (d.lastRelocateTime === undefined) d.lastRelocateTime = 0;
          if (!d.buildings.castle) d.buildings.castle = 1; if (!d.buildings.barracks) d.buildings.barracks = 1; 
          if (d.buildings.builder === undefined) d.buildings.builder = 0; 
          if (d.buildings.academy === undefined) d.buildings.academy = 0;

          if (!d.buildQueues) { d.buildQueues = []; if (d.buildQueue) { d.buildQueues.push(d.buildQueue); delete d.buildQueue; } }

          await setDoc(playerRef, d, {merge:true});
        }

        // 💡 權限判定：信箱是 admin 或者 名字有 GM 都可以免冷卻遷城
        isAdmin = (user.email === 'admin@gmail.com') || (d.name && d.name.includes('GM'));

        if (!wSnap.exists()) { 
          await setDoc(worldRef, { name: d.name, x: d.x, y: d.y, troops: d.troops.infantry+d.troops.archer+d.troops.cavalry, castleLevel: d.buildings.castle }); 
        } else { await setDoc(worldRef, { castleLevel: d.buildings.castle }, {merge:true}); }

        onSnapshot(playerRef, (docSnap) => {
          if (docSnap.exists()) {
            myData = docSnap.data();
            isAdmin = (user.email === 'admin@gmail.com') || (myData.name && myData.name.includes('GM'));
            if (!myData.buildQueues) myData.buildQueues = [];
            updateFogOfWar();
            if (!hasCentered) { resizeCanvas(); centerCameraOn(myData.x, myData.y); hasCentered = true; }
            const isUnderAttack = myData.marches.some(m => m.type === 'defend_npc');
            document.getElementById('danger-overlay').style.display = isUnderAttack ? 'block' : 'none';
            renderSelf(); 
          }
        });

        onSnapshot(doc(db, "world_map", "WORLD_BOSS"), (snap) => {
          if (snap.exists()) { worldBoss = snap.data(); } else spawnWorldBoss();
        });

        await window.refreshMap();
        setInterval(localTick, 1000); requestAnimationFrame(renderLoop); setInterval(window.refreshMap, 60000);
      } else {
        document.getElementById("login-panel").style.display = "flex"; myUid = null; myData = null; isAdmin = false;
      }
    });

    window.addEventListener("beforeunload", () => { if (myUid && myData) savePrivateData(); });

    function resizeCanvas() {
      const frame = document.getElementById('map-frame');
      if(frame && canvas) { canvas.width = frame.clientWidth; canvas.height = frame.clientHeight; clampCamera(); }
    }
    window.addEventListener('resize', resizeCanvas);

    // 💡 Bounding Box 範圍優化演算法，確保 1 萬格地圖依舊極速順暢
    function updateFogOfWar() {
      if (!myData) return;
      if (godModeFog) { for (let x=0; x<WORLD_COLS; x++) for(let y=0; y<WORLD_ROWS; y++) exploredTiles[x][y] = true; return; }
      
      const r = BASE_VISION_RADIUS + currentVisionBonus;
      const minX = Math.max(0, myData.x - r), maxX = Math.min(WORLD_COLS - 1, myData.x + r);
      const minY = Math.max(0, myData.y - r), maxY = Math.min(WORLD_ROWS - 1, myData.y + r);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          if (Math.hypot(x - myData.x, y - myData.y) <= r) exploredTiles[x][y] = true;
        }
      }
    }

    function clampCamera() {
      camX = Math.max(0, Math.min(camX, WORLD_COLS * TILE_SIZE - canvas.width / zoom)); 
      camY = Math.max(0, Math.min(camY, WORLD_ROWS * TILE_SIZE - canvas.height / zoom));
    }
    function centerCameraOn(tx, ty) {
      camX = (tx * TILE_SIZE + TILE_SIZE / 2) - (canvas.width / zoom) / 2;
      camY = (ty * TILE_SIZE + TILE_SIZE / 2) - (canvas.height / zoom) / 2;
      clampCamera();
    }

    async function savePrivateData() { myData.lastTick = Date.now(); await setDoc(doc(db, "players", myUid), myData, { merge: true }); }
    
    window.refreshMap = async function() {
      const snap = await getDocs(collection(db, "world_map"));
      allCastles = []; snap.forEach(d => { if(!d.data().isBoss) allCastles.push({ id: d.id, ...d.data() }) });
      if (document.getElementById('tab-players').classList.contains('active')) renderPlayersList();
    };

    function renderPlayersList() {
      const container = document.getElementById('players-list-container');
      if (!container || !myData) return;
      const sorted = [...allCastles].map(p => { p.dist = Math.hypot(p.x - myData.x, p.y - myData.y); return p; }).filter(p => p.id !== myUid).sort((a,b) => a.dist - b.dist);
      if (sorted.length === 0) { container.innerHTML = '<p style="color:#94a3b8; font-size:0.9rem;">附近暫無其他領主。</p>'; return; }
      container.innerHTML = sorted.map(p => `
          <div style="background:#0a0f1d; border:1px solid #1e2c40; border-radius:6px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                  <strong style="color:#fff; font-size:1.05rem;">${p.name}</strong> <span style="color:#94a3b8; font-size:0.85rem;">(Lv.${p.castleLevel || 1})</span><br>
                  <span style="font-size:0.8rem; color:#94a3b8;">座標: (${p.x}, ${p.y}) | 距離: ${Math.ceil(p.dist)} 格</span>
              </div>
              <button onclick="locatePlayer(${p.x}, ${p.y})" style="background:#0ea5e9; padding:6px 12px; font-size:0.8rem;">📍 尋找</button>
          </div>
      `).join('');
    }
    window.locatePlayer = (x, y) => { switchTab('world'); centerCameraOn(x, y); };

    // ==========================================
    // 遊戲心跳
    // ==========================================
    async function localTick() {
      if (!myData) return;
      const now = Date.now(), dt = (now - myData.lastTick) / 1000; myData.lastTick = now;

      const hrToSec = 3600;
      const upkeepPerSec = (myData.troops.infantry*CFG.troops.infantry.upkeep + myData.troops.archer*CFG.troops.archer.upkeep + myData.troops.cavalry*CFG.troops.cavalry.upkeep) / hrToSec;
      const farmProdPerSec = CFG.buildings.farm.rate * myData.buildings.farm;
      
      myData.wood += dt * (CFG.buildings.lumber.rate * myData.buildings.lumber);
      myData.iron += dt * (CFG.buildings.mine.rate * myData.buildings.mine);
      myData.food += dt * farmProdPerSec - dt * upkeepPerSec;
      if (myData.food < 0) myData.food = 0;

      let needSave = false;
      let newCleared = [];
      for (let poi of myData.clearedPOI) {
        const parts = poi.split(',');
        if (parts.length >= 4) {
          const cTime = parseInt(parts[2]), cType = parts[3];
          if ((cType.startsWith('npc_')) && now - cTime > 15 * 60 * 1000) continue; 
        }
        newCleared.push(poi);
      }
      if (newCleared.length !== myData.clearedPOI.length) { myData.clearedPOI = newCleared; needSave = true; }

      let newBuildQueues = [];
      for (let q of myData.buildQueues) {
        if (now >= q.finishesAt) {
          myData.buildings[q.target]++;
          myData.logs.unshift(`[建造就緒] ${CFG.buildings[q.target].name} 升級至 Lv.${myData.buildings[q.target]}`);
          if (q.target === 'castle') setDoc(doc(db, "world_map", myUid), { castleLevel: myData.buildings.castle }, { merge: true });
          needSave = true;
        } else { newBuildQueues.push(q); }
      }
      if (myData.buildQueues.length !== newBuildQueues.length) { myData.buildQueues = newBuildQueues; needSave = true; }

      if (myData.researchQueue && now >= myData.researchQueue.finishesAt) {
        myData.research[myData.researchQueue.target]++;
        myData.logs.unshift(`[科技突破] ${CFG.techs[myData.researchQueue.target].name} 升級至 Lv.${myData.research[myData.researchQueue.target]}`);
        myData.researchQueue = null; needSave = true;
      }

      if (myData.trainQueue && now >= myData.trainQueue.finishesAt) {
        myData.troops[myData.trainQueue.type] += myData.trainQueue.count;
        myData.logs.unshift(`[徵兵就緒] ${myData.trainQueue.count} 名${CFG.troops[myData.trainQueue.type].name}入列`);
        myData.trainQueue = null; needSave = true; 
        setDoc(doc(db, "world_map", myUid), { troops: myData.troops.infantry+myData.troops.archer+myData.troops.cavalry }, { merge: true });
      }

      if (worldBoss && now > worldBoss.despawnAt) { if (Math.random() < 0.1) spawnWorldBoss(); }

      if (Math.random() < 0.005) {
        let nearestNPC = null, minDist = 15;
        for(let tx = Math.max(0, myData.x - 15); tx <= Math.min(WORLD_COLS-1, myData.x + 15); tx++) {
          for(let ty = Math.max(0, myData.y - 15); ty <= Math.min(WORLD_ROWS-1, myData.y + 15); ty++) {
            const cell = MAP_CACHE[tx] && MAP_CACHE[tx][ty];
            if (cell && cell.entity && (cell.entity.type.startsWith('npc_')) && !getClearedPOI(tx, ty)) {
              const dist = Math.hypot(tx - myData.x, ty - myData.y);
              if (dist < minDist) { minDist = dist; nearestNPC = {x: tx, y: ty, ent: cell.entity}; }
            }
          }
        }
        if (nearestNPC && !myData.marches.some(m => m.type === 'defend_npc' && m.startX === nearestNPC.x && m.startY === nearestNPC.y)) {
          const timeMs = Math.ceil(minDist * 4 * 1000); 
          const enemyPwr = Math.floor(10 + myData.buildings.castle * 15);
          myData.marches.push({
            id: 'M'+Date.now(), type: 'defend_npc', startX: nearestNPC.x, startY: nearestNPC.y, targetX: myData.x, targetY: myData.y,
            startTime: Date.now(), finishesAt: Date.now() + timeMs, npcPower: enemyPwr, npcName: nearestNPC.ent.name
          });
          myData.logs.unshift(`🚨 [警戒] ${nearestNPC.ent.name} 敵軍正朝我方進軍！預計 ${formatTime(Math.ceil(timeMs/1000))} 抵達！`);
          needSave = true;
        }
      }

      let newMarches = [];
      for (let m of myData.marches) {
        if (now >= m.finishesAt) {
          if (m.type === 'return') {
            myData.troops.infantry += m.troops.infantry; myData.troops.archer += m.troops.archer; myData.troops.cavalry += m.troops.cavalry;
            myData.wood += m.loot.wood; myData.iron += m.loot.iron; myData.food += m.loot.food;
            if (m.loot.speedup) myData.items.speedup += m.loot.speedup;
            let lootStr = `木:${m.loot.wood} 鐵:${m.loot.iron} 糧:${m.loot.food}`;
            if (m.loot.speedup) lootStr += ` | ⏳加速x${m.loot.speedup}`;
            myData.logs.unshift(`[歸城] 遠征軍安全返回。帶回 ${lootStr}`);
            setDoc(doc(db, "world_map", myUid), { troops: myData.troops.infantry+myData.troops.archer+myData.troops.cavalry }, { merge: true });
          } 
          else if (m.type === 'attack_player') { const res = await resolveAttackPlayer(m); if (res.survived) newMarches.push(createReturnMarch(m, res.troops, res.loot)); } 
          else if (m.type === 'attack_boss') { const res = await resolveAttackBoss(m); if (res.survived) newMarches.push(createReturnMarch(m, res.troops, res.loot)); }
          else if (m.type === 'defend_npc') { await resolveDefendNPC(m); }
          else { const res = await resolveInteractNPC(m); if (res.survived) newMarches.push(createReturnMarch(m, res.troops, res.loot)); }
          needSave = true;
        } else { newMarches.push(m); }
      }
      
      if (needSave) { myData.marches = newMarches; await savePrivateData(); }
      renderSelf();
    }

    function createReturnMarch(oldMarch, survivedTroops, loot) {
      return { id: 'R'+Date.now(), type: 'return', startX: oldMarch.targetX, startY: oldMarch.targetY, targetX: oldMarch.startX, targetY: oldMarch.startY, startTime: Date.now(), finishesAt: Date.now() + (oldMarch.finishesAt - oldMarch.startTime), troops: survivedTroops, loot: loot };
    }

    function getMyPower(troops) {
      const t = myData.research || {infantry_atk:0, archer_atk:0, cavalry_atk:0};
      return troops.infantry * (CFG.troops.infantry.pwr + (t.infantry_atk||0)) +
             troops.archer * (CFG.troops.archer.pwr + (t.archer_atk||0)) +
             troops.cavalry * (CFG.troops.cavalry.pwr + (t.cavalry_atk||0));
    }
    function getPwrByTech(troops, tech) {
      return (troops.infantry||0) * (CFG.troops.infantry.pwr + (tech.infantry_atk||0)) +
             (troops.archer||0) * (CFG.troops.archer.pwr + (tech.archer_atk||0)) +
             (troops.cavalry||0) * (CFG.troops.cavalry.pwr + (tech.cavalry_atk||0));
    }

    async function resolveDefendNPC(m) {
      const defPwr = getMyPower(myData.troops);
      if (defPwr >= m.npcPower) {
        const lossRatio = m.npcPower / (defPwr + 1);
        myData.troops.infantry -= Math.floor(myData.troops.infantry * lossRatio * 0.3); myData.troops.archer -= Math.floor(myData.troops.archer * lossRatio * 0.3); myData.troops.cavalry -= Math.floor(myData.troops.cavalry * lossRatio * 0.3);
        myData.wood += 200; myData.iron += 200; myData.food += 200;
        myData.logs.unshift(`[守城大捷] 成功擊退 ${m.npcName}！繳獲後勤物資。`);
      } else {
        myData.troops.infantry = 0; myData.troops.archer = 0; myData.troops.cavalry = 0;
        const lW = Math.floor(myData.wood * 0.3), lI = Math.floor(myData.iron * 0.3), lF = Math.floor(myData.food * 0.3);
        myData.wood -= lW; myData.iron -= lI; myData.food -= lF;
        
        const bKeys = Object.keys(myData.buildings).filter(k => myData.buildings[k] > 1);
        let dLog = "";
        if (bKeys.length > 0) {
          const rKey = bKeys[Math.floor(Math.random() * bKeys.length)]; myData.buildings[rKey]--;
          dLog = `，【${CFG.buildings[rKey].name}】遭破壞降級！`;
          if (rKey === 'castle') setDoc(doc(db, "world_map", myUid), { castleLevel: myData.buildings.castle }, { merge: true });
        }
        myData.logs.unshift(`[城防潰敗] ${m.npcName} 攻破防線！被掠奪資源${dLog}`);
      }
      setDoc(doc(db, "world_map", myUid), { troops: myData.troops.infantry+myData.troops.archer+myData.troops.cavalry }, { merge: true });
    }

    async function resolveInteractNPC(m) {
      let res = { survived: true, troops: m.troops, loot: {wood:0, iron:0, food:0} };
      if (m.entity.type === 'relic') { 
        res.loot = m.entity.loot; myData.logs.unshift(`[發掘] 探險隊挖出巨量資源，正在返航中！`); 
      } else if (m.entity.type === 'npc_capital') {
        res.loot = m.entity.loot; 
        if (res.troops.infantry > 0) res.troops.infantry -= Math.floor(Math.random() * 20 + 10);
        if (res.troops.archer > 0) res.troops.archer -= Math.floor(Math.random() * 10 + 5);
        if (res.troops.cavalry > 0) res.troops.cavalry -= Math.floor(Math.random() * 5 + 2);
        myData.logs.unshift(`[史詩大捷] 成功摧毀 ${m.entity.name}！獲取海量戰利品與榮耀。`);
      } else if (m.entity.type === 'npc_fortress' || m.entity.type === 'npc_castle') { 
        res.loot = m.entity.loot; if (res.troops.infantry > 0) res.troops.infantry -= Math.floor(Math.random() * 5 + 2); myData.logs.unshift(`[遠征] 摧毀 ${m.entity.name}！滿載戰利品返航。`); 
      } else { 
        res.loot = m.entity.loot; if (res.troops.infantry > 0) res.troops.infantry -= Math.floor(Math.random() * 2); myData.logs.unshift(`[討伐] 成功剿滅 ${m.entity.name}！準備返航。`); 
      }
      myData.clearedPOI.push(`${m.targetX},${m.targetY},${Date.now()},${m.entity.type}`);
      return res;
    }

    async function resolveAttackBoss(m) {
      let res = { survived: true, troops: m.troops, loot: {wood:0, iron:0, food:0, speedup:0} };
      try {
        await runTransaction(db, async (transaction) => {
          const bRef = doc(db, "world_map", "WORLD_BOSS"); const bDoc = await transaction.get(bRef);
          if (!bDoc.exists()) throw new Error("Boss dead");
          const boss = bDoc.data();
          const pwr = getPwrByTech(m.troops, m.techs);
          const dmg = Math.min(boss.hp, pwr * 10 + Math.floor(Math.random()*50));
          
          boss.hp -= dmg; if (boss.hp <= 0) boss.hp = 0;
          transaction.set(bRef, boss);
          
          res.loot.wood = dmg * 2; res.loot.iron = dmg * 2; res.loot.food = dmg * 2; res.loot.speedup = Math.floor(dmg / 200); 
          myData.logs.unshift(`[世界首領] 對首領造成 ${dmg} 傷害！獲取 ${res.loot.speedup} 個加速道具。`);
        });
      } catch (e) { myData.logs.unshift(`[世界首領] 抵達時首領已消失。`); }
      return res;
    }

    async function resolveAttackPlayer(m) {
      let res = { survived: false, troops: m.troops, loot: {wood:0, iron:0, food:0} };
      try {
        await runTransaction(db, async (transaction) => {
          const tPrivRef = doc(db, "players", m.targetUid), tPubRef = doc(db, "world_map", m.targetUid);
          const tDoc = await transaction.get(tPrivRef);
          if (!tDoc.exists()) throw new Error("城池空");
          const target = tDoc.data();
          
          const attPwr = getPwrByTech(m.troops, m.techs);
          const defTroops = target.troops || {infantry:0, archer:0, cavalry:0};
          const defPwr = getPwrByTech(defTroops, target.research || {});

          if (attPwr > defPwr) {
            const lW = Math.floor(target.wood * 0.3), lI = Math.floor(target.iron * 0.3);
            const bKeys = Object.keys(target.buildings).filter(k => target.buildings[k] > 1);
            let dLog = ""; let pLevel = target.buildings.castle;
            if (bKeys.length > 0) {
              const rKey = bKeys[Math.floor(Math.random() * bKeys.length)]; target.buildings[rKey]--;
              dLog = `，且【${CFG.buildings[rKey].name}】遭破壞降級！`;
              if (rKey === 'castle') pLevel = target.buildings.castle;
            }
            transaction.set(tPrivRef, { wood: target.wood - lW, iron: target.iron - lI, troops: {infantry:0,archer:0,cavalry:0}, buildings: target.buildings, logs: [`[城破] 遭到突襲！損失物資${dLog}`, ...(target.logs || [])] }, { merge: true });
            transaction.set(tPubRef, { troops: 0, castleLevel: pLevel }, { merge: true });
            res.survived = true; res.loot = { wood: lW, iron: lI, food: 0 };
            myData.logs.unshift(`[大捷] 攻破 ${m.targetName}！滿載戰利品返航中。`);
          } else {
            transaction.set(tPrivRef, { logs: [`[堅壁清野] 擊退敵軍！`, ...(target.logs || [])] }, { merge: true });
            myData.logs.unshift(`[戰敗] 突擊 ${m.targetName} 遭遇重創，部隊全數陣亡！`);
          }
        });
        window.refreshMap();
      } catch (err) { res.survived = true; myData.logs.unshift(`[撲空] 敵方已遷城，部隊折返。`); }
      return res;
    }

    // ==========================================
    // 渲染循環與操作
    // ==========================================
    function renderLoop() {
      if (document.getElementById('tab-world').classList.contains('active')) drawWorldMap();
      requestAnimationFrame(renderLoop);
    }

    function drawWorldMap() {
      if (!myData) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);

      const vW = canvas.width/zoom, vH = canvas.height/zoom;
      const radius = BASE_VISION_RADIUS + currentVisionBonus;
      const sC = Math.max(0, Math.floor(camX/TILE_SIZE)-1), eC = Math.min(WORLD_COLS, Math.ceil((camX+vW)/TILE_SIZE)+1);
      const sR = Math.max(0, Math.floor(camY/TILE_SIZE)-1), eR = Math.min(WORLD_ROWS, Math.ceil((camY+vH)/TILE_SIZE)+1);
      
      const t = Date.now();

      for (let x = sC; x < eC; x++) {
        for (let y = sR; y < eR; y++) {
          if (x<0 || x>=WORLD_COLS || y<0 || y>=WORLD_ROWS) continue;
          const px = x*TILE_SIZE, py = y*TILE_SIZE;
          if (!exploredTiles[x][y]) { ctx.fillStyle='#050811'; ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); continue; }

          const cell = MAP_CACHE[x] && MAP_CACHE[x][y];
          const dist = Math.hypot(x-50, y-50);
          const isCore = dist <= 14, isMid = dist > 14 && dist <= 32;

          if (cell.type === 'plains') { 
            ctx.fillStyle = isCore ? '#2e1065' : (isMid ? '#451a03' : '#1e3a1e'); ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); 
            ctx.fillStyle = isCore ? '#4c1d95' : (isMid ? '#78350f' : '#2d5a2d'); ctx.fillRect(px+10,py+15,3,6); ctx.fillRect(px+35,py+30,4,8);
          }
          else if (cell.type === 'forest') { 
            ctx.fillStyle = isCore ? '#1e1b4b' : (isMid ? '#291404' : '#142914'); ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); 
            ctx.fillStyle = isCore ? '#312e81' : (isMid ? '#431407' : '#065f46'); ctx.beginPath(); ctx.arc(px+25,py+25,14,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = isCore ? '#4338ca' : (isMid ? '#7c2d12' : '#10b981'); ctx.beginPath(); ctx.arc(px+20,py+22,10,0,Math.PI*2); ctx.arc(px+36,py+30,8,0,Math.PI*2); ctx.fill(); 
          }
          else if (cell.type === 'mountain') { 
            ctx.fillStyle = isCore ? '#1e1b4b' : (isMid ? '#291404' : '#262626'); ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); 
            ctx.fillStyle = '#52525b'; ctx.beginPath(); ctx.moveTo(px+27,py+10); ctx.lineTo(px+5,py+48); ctx.lineTo(px+50,py+48); ctx.fill(); 
            ctx.fillStyle = '#d4d4d8'; ctx.beginPath(); ctx.moveTo(px+27,py+10); ctx.lineTo(px+18,py+25); ctx.lineTo(px+36,py+25); ctx.fill(); 
          }
          else { 
            ctx.fillStyle='#1e3a8a'; ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); 
            ctx.fillStyle='#3b82f6'; const wave = Math.sin(t/500 + x + y) * 3; ctx.fillRect(px+10, py+20+wave, 15, 2); ctx.fillRect(px+25, py+35-wave, 20, 2);
          }
          ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.strokeRect(px,py,TILE_SIZE,TILE_SIZE);

          if (cell.entity && !allCastles.some(p => p.x === x && p.y === y)) {
            const clrInfo = getClearedPOI(x, y);
            const floatY = clrInfo ? 0 : Math.sin(t/300 + x + y) * 4;
            
            if (clrInfo) {
              ctx.font = '24px sans-serif'; ctx.textAlign='center'; ctx.fillText('🔥', px+TILE_SIZE/2, py+35);
            } else {
              if (cell.entity.type === 'npc_capital') {
                ctx.fillStyle = '#4c1d95'; ctx.fillRect(px+2, py+2, TILE_SIZE-4, TILE_SIZE-4);
                ctx.font = '32px sans-serif'; ctx.textAlign='center'; ctx.fillText('😈', px+TILE_SIZE/2, py+35+floatY);
                ctx.fillStyle = '#d946ef'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('黑暗王城', px+TILE_SIZE/2, py+50);
              } else if (cell.entity.type === 'npc_fortress') {
                ctx.fillStyle = '#3f000f'; ctx.fillRect(px+6, py+6, TILE_SIZE-12, TILE_SIZE-12);
                ctx.font = '24px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏯', px+TILE_SIZE/2, py+32+floatY);
                ctx.fillStyle = '#f43f5e'; ctx.font = '10px sans-serif'; ctx.fillText('黑暗要塞', px+TILE_SIZE/2, py+45);
              } else if (cell.entity.type === 'npc_castle') {
                ctx.fillStyle = '#3b0764'; ctx.fillRect(px+10, py+10, TILE_SIZE-20, TILE_SIZE-20);
                ctx.font = '20px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏰', px+TILE_SIZE/2, py+32+floatY);
                ctx.fillStyle = '#a855f7'; ctx.font = '10px sans-serif'; ctx.fillText('黑暗城堡', px+TILE_SIZE/2, py+45);
              } else if (cell.entity.type === 'npc_outpost') {
                ctx.fillStyle = '#171717'; ctx.fillRect(px+12, py+12, TILE_SIZE-24, TILE_SIZE-24);
                ctx.font = '20px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏚️', px+TILE_SIZE/2, py+32+floatY);
                ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.fillText('黑暗前哨', px+TILE_SIZE/2, py+45);
              } else if (cell.entity.type === 'barbarian') {
                ctx.font = '24px sans-serif'; ctx.textAlign='center'; ctx.fillText('👹', px+TILE_SIZE/2, py+30+floatY);
                ctx.fillStyle = '#f87171'; ctx.font = '10px sans-serif'; ctx.fillText('野蠻人', px+TILE_SIZE/2, py+45);
              } else if (cell.entity.type === 'bandit') {
                ctx.font = '22px sans-serif'; ctx.textAlign='center'; ctx.fillText('⛺', px+TILE_SIZE/2, py+30+floatY);
                ctx.fillStyle = '#fdba74'; ctx.font = '10px sans-serif'; ctx.fillText('流寇', px+TILE_SIZE/2, py+45);
              } else if (cell.entity.type === 'relic') {
                ctx.font = '24px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏛️', px+TILE_SIZE/2, py+30+floatY);
                ctx.fillStyle = '#38bdf8'; ctx.font = '10px sans-serif'; ctx.fillText('遺跡', px+TILE_SIZE/2, py+45);
              }
            }
          }
          if (!godModeFog && Math.hypot(x-myData.x, y-myData.y) > radius) { ctx.fillStyle='rgba(5,8,17,0.75)'; ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE); }
        }
      }

      if (worldBoss && worldBoss.hp > 0 && exploredTiles[worldBoss.x][worldBoss.y]) {
        const bx = worldBoss.x*TILE_SIZE, by = worldBoss.y*TILE_SIZE;
        if (godModeFog || Math.hypot(worldBoss.x-myData.x, worldBoss.y-myData.y) <= radius) {
          const bounce = Math.sin(t/200)*5;
          ctx.font = '45px sans-serif'; ctx.textAlign='center'; ctx.fillText('🐉', bx+TILE_SIZE/2, by+40+bounce);
          ctx.fillStyle = '#ef4444'; ctx.fillRect(bx, by-10, TILE_SIZE*(worldBoss.hp/worldBoss.maxHp), 6);
          ctx.strokeStyle = '#fff'; ctx.strokeRect(bx, by-10, TILE_SIZE, 6);
        }
      }

      allCastles.forEach(p => {
        const isMe = (p.id === myUid);
        if (!godModeFog && !isMe && Math.hypot(p.x-myData.x, p.y-myData.y) > radius) return;
        const px = p.x*TILE_SIZE, py = p.y*TILE_SIZE;
        if (px<camX-TILE_SIZE || px>camX+vW+TILE_SIZE || py<camY-TILE_SIZE || py>camY+vH+TILE_SIZE) return;

        if (isMe) { ctx.strokeStyle='#facc15'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(px+TILE_SIZE/2,py+TILE_SIZE/2, 24+Math.sin(t/250)*4,0,Math.PI*2); ctx.stroke(); }
        
        const cLv = p.castleLevel || 1;
        if (cLv < 3) {
          ctx.fillStyle = isMe?'#3b82f6':'#ef4444'; ctx.beginPath(); ctx.moveTo(px+27,py+16); ctx.lineTo(px+12,py+40); ctx.lineTo(px+42,py+40); ctx.fill();
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(px+27,py+26); ctx.lineTo(px+22,py+40); ctx.lineTo(px+32,py+40); ctx.fill();
        } else if (cLv < 5) {
          ctx.fillStyle = isMe?'#1d4ed8':'#991b1b'; ctx.fillRect(px+12,py+16,31,26);
          ctx.fillStyle = isMe?'#3b82f6':'#ef4444'; ctx.fillRect(px+9,py+12,10,30); ctx.fillRect(px+36,py+12,10,30);
          ctx.fillStyle = '#0f172a'; ctx.fillRect(px+22,py+30,11,12);
        } else {
          ctx.fillStyle = isMe?'#1e3a8a':'#7f1d1d'; ctx.fillRect(px+10,py+24,35,18);
          ctx.fillStyle = isMe?'#1d4ed8':'#991b1b'; ctx.fillRect(px+17,py+8,21,34);
          ctx.fillStyle = isMe?'#3b82f6':'#ef4444'; ctx.fillRect(px+6,py+16,12,26); ctx.fillRect(px+37,py+16,12,26);
          ctx.fillStyle = '#facc15'; ctx.fillRect(px+15,py+8,25,4); 
          ctx.beginPath(); ctx.moveTo(px+12,py+16); ctx.lineTo(px+6,py+22); ctx.lineTo(px+18,py+22); ctx.fill();
          ctx.beginPath(); ctx.moveTo(px+43,py+16); ctx.lineTo(px+37,py+22); ctx.lineTo(px+49,py+22); ctx.fill();
          ctx.fillStyle = '#0f172a'; ctx.fillRect(px+22,py+30,11,12);
          ctx.fillStyle = '#f8fafc'; ctx.fillRect(px+27,py+2,2,6); ctx.fillStyle = isMe?'#60a5fa':'#ef4444'; ctx.fillRect(px+29,py+2,6,4);
        }

        if (zoom>0.5) {
          ctx.fillStyle=isMe?'#fef08a':'#fff'; ctx.font=isMe?'bold 12px sans-serif':'11px sans-serif'; ctx.textAlign='center';
          ctx.fillText(p.name, px+TILE_SIZE/2, py+52); ctx.fillStyle='#fbbf24'; ctx.fillText(`⚔️${p.troops||0}`, px+TILE_SIZE/2, py+8);
        }
        ctx.textAlign='start';
      });

      if (myData.marches && myData.marches.length > 0) {
        myData.marches.forEach(m => {
          let p = Math.max(0, Math.min(1, (t-m.startTime)/(m.finishesAt-m.startTime)));
          const sX = m.startX*TILE_SIZE+TILE_SIZE/2, sY = m.startY*TILE_SIZE+TILE_SIZE/2;
          const tX = m.targetX*TILE_SIZE+TILE_SIZE/2, tY = m.targetY*TILE_SIZE+TILE_SIZE/2;
          const cX = sX+(tX-sX)*p, cY = sY+(tY-sY)*p;

          ctx.beginPath(); ctx.setLineDash([6,6]); ctx.moveTo(sX, sY); ctx.lineTo(tX, tY);
          ctx.strokeStyle = m.type === 'return' ? 'rgba(59, 130, 246, 0.8)' : (m.type === 'defend_npc' ? 'rgba(147, 51, 234, 0.8)' : 'rgba(239, 68, 68, 0.8)');
          ctx.lineWidth = 2.5; ctx.stroke(); ctx.setLineDash([]);

          ctx.fillStyle = m.type === 'return' ? '#2563eb' : (m.type === 'defend_npc' ? '#9333ea' : '#dc2626');
          ctx.beginPath(); ctx.arc(cX, cY, 14, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(m.type === 'return' ? '🔙' : '⚔️', cX, cY+4);

          const left = Math.ceil((m.finishesAt-t)/1000);
          if (left > 0) { ctx.fillStyle='#facc15'; ctx.font='bold 14px sans-serif'; ctx.fillText(formatTime(left), cX, cY-20); }
          ctx.textAlign = 'start';
        });
      }
      ctx.restore();
    }

    // ==========================================
    // 實體按鈕縮放與觸控
    // ==========================================
    window.zoomMapBtn = (factor) => {
      const nZ = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      if (nZ !== zoom) {
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const wX = cx / zoom + camX, wY = cy / zoom + camY;
        zoom = nZ; camX = wX - cx / zoom; camY = wY - cy / zoom; clampCamera();
        document.getElementById('zoom-indicator').innerText = `${Math.round(zoom*100)}%`; 
      }
    };

    let isDragging = false, dragSX = 0, dragSY = 0, dragDist = 0;
    let initialPinchDist = null, initialZoom = 1, pinchCenter = null;

    function handleDown(e) {
      if (e.touches && e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialZoom = zoom;
        const r = canvas.getBoundingClientRect();
        const px = (e.touches[0].clientX + e.touches[1].clientX)/2 - r.left, py = (e.touches[0].clientY + e.touches[1].clientY)/2 - r.top;
        pinchCenter = { x: px, y: py, wX: px / zoom + camX, wY: py / zoom + camY };
        return;
      }
      isDragging=true; dragDist=0; canvas.style.cursor='grabbing'; document.getElementById("hover-hud").style.display='none';
      const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
      dragSX = cx; dragSY = cy;
    }

    function handleMove(e) {
      if (e.touches && e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const nZ = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, initialZoom * (dist / initialPinchDist)));
        if (nZ !== zoom) {
          zoom = nZ; camX = pinchCenter.wX - pinchCenter.x / zoom; camY = pinchCenter.wY - pinchCenter.y / zoom;
          clampCamera(); document.getElementById('zoom-indicator').innerText = `${Math.round(zoom*100)}%`; 
        }
        return;
      }
      if (!isDragging) return;
      e.preventDefault();
      const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = cx - dragSX, dy = cy - dragSY; dragDist += Math.hypot(dx,dy);
      dragSX = cx; dragSY = cy; camX -= dx/zoom; camY -= dy/zoom; clampCamera(); 
    }

    function handleUp(e) { 
      if (e.touches && e.touches.length < 2) initialPinchDist = null;
      isDragging = false; canvas.style.cursor='grab'; 
    }

    canvas.addEventListener("mousedown", handleDown); canvas.addEventListener("mousemove", handleMove); window.addEventListener("mouseup", handleUp);
    canvas.addEventListener("touchstart", handleDown, {passive:false}); canvas.addEventListener("touchmove", handleMove, {passive:false}); window.addEventListener("touchend", handleUp);

    // ==========================================
    // 點擊事件與出征/遷城
    // ==========================================
    let targetAction = null;
    window.closeActionModal = () => { document.getElementById("action-modal").style.display='none'; targetAction=null; };

    canvas.addEventListener("click", (e) => {
      if (dragDist > 10) return;
      const r = canvas.getBoundingClientRect();
      const cx = e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0);
      const cy = e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : 0);
      const sX = (cx - r.left) * (canvas.width / r.width), sY = (cy - r.top) * (canvas.height / r.height);
      const tX = Math.floor((sX/zoom+camX)/TILE_SIZE), tY = Math.floor((sY/zoom+camY)/TILE_SIZE);
      
      const tC = allCastles.find(p=>p.x===tX&&p.y===tY), cell = MAP_CACHE[tX] && MAP_CACHE[tX][tY], dist = Math.hypot(tX-myData.x, tY-myData.y);

      if (!godModeFog && dist > BASE_VISION_RADIUS+currentVisionBonus) return alert("🌫️ 迷霧區域無法鎖定目標！請派遣斥候或遷城靠近。");

      if (tC && tC.id!==myUid) {
        targetAction = { type: 'attack_player', id: tC.id, name: tC.name, x: tX, y: tY, dist, techs: myData.research };
        document.getElementById("modal-title").innerHTML = `⚔️ 攻擊城池 (Lv.${tC.castleLevel||1})`; 
        document.getElementById("modal-desc").innerHTML = `目標：【${tC.name}】<br>距離：${Math.ceil(dist)} 格<br><span style="color:#10b981; font-weight:bold;">🎁 預期掠奪: 敵方30%庫存資源</span>`;
        document.getElementById("troop-selector").style.display = 'block'; document.getElementById("btn-confirm-action").style.display = 'block'; document.getElementById("btn-confirm-action").innerText = "發動行軍"; document.getElementById("btn-confirm-action").style.background = '#dc2626';
      } 
      else if (worldBoss && worldBoss.hp > 0 && worldBoss.x===tX && worldBoss.y===tY) {
        targetAction = { type: 'attack_boss', name: worldBoss.name, x: tX, y: tY, dist, techs: myData.research };
        document.getElementById("modal-title").innerHTML = `🐉 討伐首領`; 
        document.getElementById("modal-desc").innerHTML = `目標：【${worldBoss.name}】<br>距離：${Math.ceil(dist)} 格<br><span style="color:#10b981; font-weight:bold;">🎁 最高可得: 萬級資源 + ⏳加速卡</span>`;
        document.getElementById("troop-selector").style.display = 'block'; document.getElementById("btn-confirm-action").style.display = 'block'; document.getElementById("btn-confirm-action").innerText = "發動討伐"; document.getElementById("btn-confirm-action").style.background = '#dc2626';
      }
      else if (cell && cell.entity && !getClearedPOI(tX,tY)) {
        const ent = cell.entity;
        let actionTitle = '⚔️ 討伐敵陣';
        if (ent.type === 'relic') actionTitle = '🏛️ 奇蹟探險';
        else if (ent.type === 'npc_capital') actionTitle = '😈 攻略王城';
        else if (ent.type === 'npc_fortress') actionTitle = '🏯 攻堅要塞';
        else if (ent.type === 'npc_castle') actionTitle = '🏰 攻打城堡';
        else if (ent.type === 'npc_outpost') actionTitle = '🏚️ 拔除前哨';

        let lootStr = '';
        if (ent.loot) lootStr = `<br><span style="color:#10b981; font-weight:bold;">🎁 戰利品: 🌲${ent.loot.wood||0} ⛏️${ent.loot.iron||0} 🌾${ent.loot.food||0}</span>`;

        targetAction = { type: ent.type==='relic'?'relic':(ent.type==='npc_capital'?'attack_capital':'attack_npc'), entity: ent, x: tX, y: tY, dist, techs: myData.research };
        document.getElementById("modal-title").innerHTML = actionTitle;
        document.getElementById("modal-desc").innerHTML = ent.type==='relic'? `探索需消耗 ${ent.reqFood} 糧食。${lootStr}`:`距離：${Math.ceil(dist)} 格<br>建議兵力戰力：${ent.reqPwr}${lootStr}`;
        document.getElementById("troop-selector").style.display = 'block'; document.getElementById("btn-confirm-action").style.display = 'block'; document.getElementById("btn-confirm-action").innerText = "發動行軍"; document.getElementById("btn-confirm-action").style.background = '#dc2626';
      }
      else if (!tC && cell && cell.type !== 'water') {
        const timeSince = Date.now() - (myData.lastRelocateTime || 0);
        const remainMs = isAdmin ? 0 : RELOCATE_COOLDOWN - timeSince;
        const moveCost = Math.max(100, Math.ceil(dist * 50));
        
        if (remainMs > 0) {
            targetAction = null;
            document.getElementById("modal-title").innerHTML = `📍 領地搬遷 (冷卻中)`;
            document.getElementById("modal-desc").innerHTML = `傳送矩陣冷卻中，需等待 <span style="color:#ef4444; font-weight:bold;">${formatTime(Math.ceil(remainMs/1000))}</span> 後方可再次搬遷。<br><span style="font-size:0.75rem; color:#94a3b8;">(管理員不受此限制)</span>`;
            document.getElementById("btn-confirm-action").style.display = 'none';
        } else {
            targetAction = { type: 'relocate', x: tX, y: tY, cost: moveCost };
            document.getElementById("modal-title").innerHTML = `📍 領地搬遷`;
            document.getElementById("modal-desc").innerHTML = `傳送至 (${tX}, ${tY})<br>距離：${Math.ceil(dist)} 格<br>消耗：${moveCost}木, ${moveCost}鐵, ${moveCost}糧`;
            document.getElementById("btn-confirm-action").style.display = 'block';
            document.getElementById("btn-confirm-action").innerText = "確認遷城"; 
            document.getElementById("btn-confirm-action").style.background = '#0ea5e9';
        }
        document.getElementById("troop-selector").style.display = 'none'; 
      } else return;

      const bLvl = myData.buildings.barracks || 1; let unlockCount = 0;
      ['inf','arc','cav'].forEach(t => { 
        const full = t==='inf'?'infantry':(t==='arc'?'archer':'cavalry');
        if (bLvl >= CFG.troops[full].reqLvl) {
          document.getElementById(`row-${t}`).style.display = 'flex';
          document.getElementById(`avail-${t}`).innerText = myData.troops[full]; document.getElementById(`send-${t}`).max = myData.troops[full]; document.getElementById(`send-${t}`).value = 0;
          unlockCount++;
        } else { document.getElementById(`row-${t}`).style.display = 'none'; }
      });
      document.getElementById('troop-lock-msg').style.display = unlockCount < 3 ? 'block' : 'none';
      document.getElementById("action-modal").style.display='flex';
    });

    document.getElementById("btn-confirm-action").addEventListener('click', () => {
      if (!targetAction) return;

      if (targetAction.type === 'relocate') {
        if (myData.wood < targetAction.cost || myData.iron < targetAction.cost || myData.food < targetAction.cost) return alert(`資源不足！需要各 ${targetAction.cost} 資源。`);
        myData.wood -= targetAction.cost; myData.iron -= targetAction.cost; myData.food -= targetAction.cost;
        myData.x = targetAction.x; myData.y = targetAction.y;
        myData.lastRelocateTime = Date.now();
        myData.logs.unshift(`[遷城] 傳送至 (${targetAction.x}, ${targetAction.y})`);
        savePrivateData(); setDoc(doc(db, "world_map", myUid), { x: myData.x, y: myData.y }, { merge: true });
        closeActionModal(); updateFogOfWar(); centerCameraOn(myData.x, myData.y); renderSelf(); window.refreshMap(); return;
      }

      const sendInf = document.getElementById('row-inf').style.display==='none' ? 0 : (parseInt(document.getElementById('send-inf').value)||0);
      const sendArc = document.getElementById('row-arc').style.display==='none' ? 0 : (parseInt(document.getElementById('send-arc').value)||0);
      const sendCav = document.getElementById('row-cav').style.display==='none' ? 0 : (parseInt(document.getElementById('send-cav').value)||0);
      
      if (sendInf===0 && sendArc===0 && sendCav===0) return alert("請派遣部隊！");
      if (sendInf > myData.troops.infantry || sendArc > myData.troops.archer || sendCav > myData.troops.cavalry) return alert("兵力不足！");
      if (myData.marches && myData.marches.length >= 3) return alert("最多同時維持 3 條行軍線路。");
      
      let spd = 2; 
      if (sendInf > 0) spd = Math.max(spd, CFG.troops.infantry.speed);
      if (sendArc > 0) spd = Math.max(spd, CFG.troops.archer.speed);
      
      const timeMs = Math.ceil(targetAction.dist * spd * 1000);
      myData.troops.infantry -= sendInf; myData.troops.archer -= sendArc; myData.troops.cavalry -= sendCav;

      myData.marches.push({
        id: 'M'+Date.now(), type: targetAction.type==='attack_capital'?'attack_npc':targetAction.type, startX: myData.x, startY: myData.y, targetX: targetAction.x, targetY: targetAction.y,
        startTime: Date.now(), finishesAt: Date.now()+timeMs, troops: { infantry: sendInf, archer: sendArc, cavalry: sendCav },
        targetUid: targetAction.id, targetName: targetAction.name, entity: targetAction.entity, npcPower: targetAction.npcPower, techs: myData.research
      });

      myData.logs.unshift(`[出征] 預計 ${formatTime(Math.ceil(timeMs/1000))} 後抵達。`);
      savePrivateData(); setDoc(doc(db, "world_map", myUid), { troops: myData.troops.infantry+myData.troops.archer+myData.troops.cavalry }, { merge: true });
      closeActionModal(); renderSelf();
    });

    // ==========================================
    // 渲染 UI
    // ==========================================
    function renderSelf() {
      document.getElementById('player-title').innerHTML = `<span>👑 ${myData.name} (${myData.x}, ${myData.y})</span> <button onclick="openRenameModal()" style="background:#334155; padding:6px 10px; font-size:0.8rem;">✏️ 改名</button>`;
      
      const hrToSec = 3600;
      const upkeepPerHr = myData.troops.infantry*CFG.troops.infantry.upkeep + myData.troops.archer*CFG.troops.archer.upkeep + myData.troops.cavalry*CFG.troops.cavalry.upkeep;
      
      const woodProdPerHr = CFG.buildings.lumber.rate * myData.buildings.lumber * hrToSec;
      const ironProdPerHr = CFG.buildings.mine.rate * myData.buildings.mine * hrToSec;
      const farmProdPerSec = CFG.buildings.farm.rate * myData.buildings.farm * hrToSec;
      const netFood = farmProdPerSec - upkeepPerHr;

      document.getElementById('res-wood').innerText = Math.floor(myData.wood); 
      document.getElementById('rate-wood').innerText = `+${Math.floor(woodProdPerHr)}/h`;
      
      document.getElementById('res-iron').innerText = Math.floor(myData.iron); 
      document.getElementById('rate-iron').innerText = `+${Math.floor(ironProdPerHr)}/h`;
      
      document.getElementById('res-food').innerText = Math.floor(myData.food);
      document.getElementById('rate-food').innerText = `${netFood>=0?'+':''}${Math.floor(netFood)}/h`;
      document.getElementById('rate-food').style.color = netFood>=0 ? '#10b981' : '#ef4444';

      document.getElementById('res-inf').innerText = myData.troops.infantry; document.getElementById('res-arc').innerText = myData.troops.archer; document.getElementById('res-cav').innerText = myData.troops.cavalry;
      document.getElementById('res-speedup').innerText = myData.items.speedup || 0;

      const maxQueues = 1 + (myData.buildings.builder || 0);
      document.getElementById('build-queue-text').innerText = `(${myData.buildQueues.length}/${maxQueues})`;

      const bContainer = document.getElementById('building-container');
      bContainer.innerHTML = Object.entries(myData.buildings).map(([key, lvl]) => {
        const cost = getUpgradeCost(key, lvl);
        const timeSec = getUpgradeTime(key, lvl);
        const isUpgrading = myData.buildQueues.some(q => q.target === key);
        const isMax = (key === 'builder' && lvl >= CFG.buildings.builder.maxLevel);
        const disabled = isMax || isUpgrading || myData.buildQueues.length >= maxQueues;
        const btnText = isMax ? '已達上限' : (isUpgrading ? '升級中...' : `升級 (${formatTime(timeSec)})`);

        return `<div class="item-card"><div><strong style="font-size:1.1rem;">${CFG.buildings[key].name}</strong> <span style="color:#fbbf24;">(Lv.${lvl})</span><div style="font-size:0.85rem; color:#94a3b8; margin:8px 0;">所需: 🌲${cost.w} ⛏️${cost.i}</div></div><button style="width:100%; background:${isMax?'#475569':''}" onclick="window.upgradeBuilding('${key}')" ${disabled?'disabled':''}>${btnText}</button></div>`;
      }).join('');

      const rContainer = document.getElementById('research-container');
      if (myData.buildings.academy < 1) {
        rContainer.innerHTML = '<p style="color:#94a3b8; font-size:0.9rem; padding:10px;">請先建造並升級【學院】來解鎖科技研發。</p>';
      } else {
        rContainer.innerHTML = Object.entries(CFG.techs).map(([key, d]) => {
            const lvl = myData.research[key] || 0;
            const cost = getUpgradeCost(key, lvl, true);
            const timeSec = getUpgradeTime(key, lvl, true);
            const isResearching = myData.researchQueue && myData.researchQueue.target === key;
            const isMax = lvl >= myData.buildings.academy * 2;
            let btnText = isMax ? '學院等級不足' : (isResearching ? '研發中...' : `研發 (${formatTime(timeSec)})`);
            let disabled = isMax || myData.researchQueue ? 'disabled' : '';

            return `<div class="item-card"><div><strong style="font-size:1.1rem;">${d.icon} ${d.name}</strong> <span style="color:#fbbf24;">(Lv.${lvl})</span><div style="font-size:0.85rem; color:#94a3b8; margin:8px 0;">所需: 🌲${cost.w} ⛏️${cost.i}<br>附加戰力: +${lvl}</div></div><button style="width:100%; background:${isMax?'#475569':''}" onclick="window.startResearch('${key}')" ${disabled}>${btnText}</button></div>`;
        }).join('');
      }

      const tContainer = document.getElementById('train-container');
      const bLvl = myData.buildings.barracks || 1;
      tContainer.innerHTML = Object.entries(CFG.troops).map(([key, d]) => {
        if (bLvl < d.reqLvl) return `<div class="item-card" style="opacity:0.5; justify-content:flex-start;"><div><strong style="font-size:1.1rem;">🔒 未解鎖</strong><div style="font-size:0.85rem; color:#94a3b8; margin:8px 0;">需 兵營 Lv.${d.reqLvl}</div></div><button style="width:100%; background:#475569; margin-top:auto;" disabled>未解鎖</button></div>`;
        const buff = myData.research[`${key}_atk`] || 0;
        return `<div class="item-card" style="justify-content:flex-start;"><div><strong style="font-size:1.1rem;">${d.icon} ${d.name}</strong><div style="font-size:0.85rem; color:#94a3b8; margin:8px 0;">需: 🌲${d.w} ⛏️${d.i} 🌾${d.f}<br>戰力: ${d.pwr}<span style="color:#10b981;">+${buff}</span> | 維護: 🌾${d.upkeep}/h</div></div><button style="width:100%; background:#059669; margin-top:auto;" onclick="window.trainTroopType('${key}')" ${myData.trainQueue?'disabled':''}>招募 5名 (${formatTime(d.time)})</button></div>`;
      }).join('');

      let qMsg = []; const now = Date.now();
      if (myData.buildQueues.length > 0) { const earliest = Math.min(...myData.buildQueues.map(q => q.finishesAt)); qMsg.push(`🏗️ ${myData.buildQueues.length}個設施升級中 (${formatTime(Math.max(0, Math.ceil((earliest-now)/1000)))})`); }
      if (myData.researchQueue) qMsg.push(`🧪 研發中... (${formatTime(Math.max(0, Math.ceil((myData.researchQueue.finishesAt-now)/1000)))})`);
      if (myData.trainQueue) qMsg.push(`⚔️ 招募中... (${formatTime(Math.max(0, Math.ceil((myData.trainQueue.finishesAt-now)/1000)))})`);
      if (myData.marches && myData.marches.length > 0) qMsg.push(`🚩 ${myData.marches.length} 支部隊行軍中`);
      document.getElementById('queue-status').innerText = qMsg.join(' | ');
      document.getElementById('log-list').innerHTML = myData.logs.slice(0, 8).map(l => `<p>${l}</p>`).join('');
    }

    window.openRenameModal = () => { document.getElementById("rename-modal").style.display='flex'; };
    window.closeRenameModal = () => { document.getElementById("rename-modal").style.display='none'; };
    window.confirmRename = async () => {
      const newName = document.getElementById('rename-input').value.trim();
      if(newName.length < 2 || newName.length > 8) return alert('名字長度需為 2~8 字元！');
      if (!myData.freeRenameUsed) myData.freeRenameUsed = true;
      else if (myData.items.renameCard > 0) myData.items.renameCard--; else return alert('需要改名卡！');
      myData.name = newName; await savePrivateData(); await setDoc(doc(db, "world_map", myUid), { name: newName }, { merge: true });
      alert("✅ 名稱已更改！"); closeRenameModal(); renderSelf();
    };

    window.locateHome = () => { if (myData) { centerCameraOn(myData.x, myData.y); switchTab('world'); }};
    window.dispatchScout = () => {
      if (!myData) return; if (myData.food < 30) return alert('糧食不足 30！');
      myData.food -= 30; currentVisionBonus += 3; updateFogOfWar(); savePrivateData();
      setTimeout(() => { currentVisionBonus = Math.max(0, currentVisionBonus-3); }, 30000);
    };
    
    window.upgradeBuilding = async (key) => {
      const maxQueues = 1 + (myData.buildings.builder || 0);
      if (myData.buildQueues.some(q => q.target === key)) return alert('該設施正在升級中！');
      if (myData.buildQueues.length >= maxQueues) return alert('建築隊列已滿！請升級工匠小屋。');
      
      const lvl = myData.buildings[key], cost = getUpgradeCost(key, lvl);
      if (myData.wood < cost.w || myData.iron < cost.i) return alert('資源不足！');
      const timeSec = getUpgradeTime(key, lvl);
      myData.wood -= cost.w; myData.iron -= cost.i; 
      myData.buildQueues.push({ target: key, finishesAt: Date.now() + timeSec * 1000 }); 
      await savePrivateData();
    };

    window.startResearch = async (key) => {
      if (myData.researchQueue) return;
      const lvl = myData.research[key] || 0;
      const cost = getUpgradeCost(key, lvl, true);
      if (myData.wood < cost.w || myData.iron < cost.i) return alert('資源不足！');
      const timeSec = getUpgradeTime(key, lvl, true);
      myData.wood -= cost.w; myData.iron -= cost.i;
      myData.researchQueue = { target: key, finishesAt: Date.now() + timeSec * 1000 };
      await savePrivateData();
    };
    
    window.trainTroopType = async (typeKey) => {
      if (myData.trainQueue) return;
      const req = CFG.troops[typeKey];
      if (myData.buildings.barracks < req.reqLvl) return alert('兵營等級不足！');
      if (myData.wood < req.w || myData.iron < req.i || myData.food < req.f) return alert('資源不足！');
      myData.wood -= req.w; myData.iron -= req.i; myData.food -= req.f;
      myData.trainQueue = { type: typeKey, count: 5, finishesAt: Date.now() + (req.time * 1000) }; await savePrivateData();
    };

    window.useSpeedUp = async (type) => {
      if (!myData || myData.items.speedup <= 0) return alert("沒有足夠的加速道具！");
      if (type === 'build') {
        if (myData.buildQueues.length === 0) return alert("沒有進行中的建築隊列！");
        myData.items.speedup--;
        myData.buildQueues.forEach(q => { q.finishesAt -= 5 * 60 * 1000; if (q.finishesAt < Date.now()) q.finishesAt = Date.now(); });
      } else if (type === 'research') {
        if (!myData.researchQueue) return alert("沒有進行中的研發隊列！");
        myData.items.speedup--;
        myData.researchQueue.finishesAt -= 5 * 60 * 1000; if (myData.researchQueue.finishesAt < Date.now()) myData.researchQueue.finishesAt = Date.now();
      } else {
        if (!myData.trainQueue) return alert("該項目沒有進行中的隊列！");
        myData.items.speedup--;
        myData.trainQueue.finishesAt -= 5 * 60 * 1000; if (myData.trainQueue.finishesAt < Date.now()) myData.trainQueue.finishesAt = Date.now();
      }
      await savePrivateData();
    };
  </script>
</body>
</html>
